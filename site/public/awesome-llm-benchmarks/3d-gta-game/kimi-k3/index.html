<script>
(function () {
'use strict';

if (typeof THREE === 'undefined') {
  document.getElementById('loadmsg').textContent = 'Could not load Three.js from CDN — check your network connection.';
  return;
}

/* ============================================================
   MERIDIAN CITY — a fully procedural open-world sandbox.
   Every mesh, texture, sign, and behavior is generated in code.
   ============================================================ */

// ---------- deterministic RNG ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260705);
function rand(a, b) { return a + (b - a) * rng(); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length) % arr.length]; }
function chance(p) { return rng() < p; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
const TAU = Math.PI * 2;

// ---------- world constants ----------
const N = 12;                 // blocks per side
const TILE = 60;              // block pitch
const ROAD_W = 14;            // road width
const SPAN = N * TILE;
const HALF = SPAN / 2;
const LANE = 3.3;
const nodePos = k => k * TILE - HALF;
const blockCenter = i => (i - N / 2 + 0.5) * TILE;

// ---------- registries ----------
const colliders = [];
const surfaces = [];
const lampPosts = [];
const signalInters = [];
const trafficCars = [];
const parkedCarList = [];
const peds = [];
const policeCars = [];
const neonMats = [];
const windowMats = [];
const headlightCones = [];
const stores = [];
const parkingLots = [];
let heli = null, planeObj = null;

function addCollider(x0, z0, x1, z1, y0, y1) {
  colliders.push({ x0, z0, x1, z1, y0: (y0 === undefined ? 0 : y0), y1: (y1 === undefined ? 30 : y1) });
}
function addSurface(s) { surfaces.push(s); }

const colliderGrid = new Map();
function bucketColliders() {
  colliders.forEach((c, idx) => {
    const i0 = Math.floor((c.x0 + HALF) / TILE), i1 = Math.floor((c.x1 + HALF) / TILE);
    const j0 = Math.floor((c.z0 + HALF) / TILE), j1 = Math.floor((c.z1 + HALF) / TILE);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const k = i + ':' + j;
      if (!colliderGrid.has(k)) colliderGrid.set(k, []);
      colliderGrid.get(k).push(idx);
    }
  });
}
function collidersNear(x, z) {
  const out = [];
  const ci = Math.floor((x + HALF) / TILE), cj = Math.floor((z + HALF) / TILE);
  for (let i = ci - 1; i <= ci + 1; i++) for (let j = cj - 1; j <= cj + 1; j++) {
    const b = colliderGrid.get(i + ':' + j);
    if (b) for (const idx of b) out.push(colliders[idx]);
  }
  return out;
}

function resolveCollision(x, z, r, y) {
  let hit = false;
  const near = collidersNear(x, z);
  for (let k = 0; k < near.length; k++) {
    const c = near[k];
    if (y > c.y1 || y + 1.7 < c.y0) continue;
    const cx = clamp(x, c.x0, c.x1), cz = clamp(z, c.z0, c.z1);
    let dx = x - cx, dz = z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    hit = true;
    if (d2 > 1e-9) {
      const d = Math.sqrt(d2), push = (r - d) / d;
      x += dx * push; z += dz * push;
    } else {
      const pxl = x - c.x0, pxr = c.x1 - x, pzl = z - c.z0, pzr = c.z1 - z;
      const m = Math.min(pxl, pxr, pzl, pzr);
      if (m === pxl) x = c.x0 - r; else if (m === pxr) x = c.x1 + r;
      else if (m === pzl) z = c.z0 - r; else z = c.z1 + r;
    }
  }
  return { x, z, hit };
}

function groundHeightAt(x, z) {
  let y = 0;
  for (let i = 0; i < surfaces.length; i++) {
    const s = surfaces[i];
    if (x < s.x0 || x > s.x1 || z < s.z0 || z > s.z1) continue;
    let sy;
    if (s.y0 === s.y1) sy = s.y0;
    else {
      const a = s.axis === 'x' ? x : z;
      const t = clamp((a - s.a0) / (s.a1 - s.a0), 0, 1);
      sy = lerp(s.y0, s.y1, t);
    }
    if (sy > y) y = sy;
  }
  return y;
}
function surfaceSlopeAt(x, z, axis) {
  for (let i = 0; i < surfaces.length; i++) {
    const s = surfaces[i];
    if (x < s.x0 || x > s.x1 || z < s.z0 || z > s.z1) continue;
    if (s.axis === axis && s.y0 !== s.y1) return (s.y1 - s.y0) / Math.abs(s.a1 - s.a0);
  }
  return 0;
}

/* ============================================================
   Procedural canvas textures
   ============================================================ */
function canvasTex(w, h, draw, repeatX, repeatY) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeatX) t.repeat.set(repeatX, repeatY || repeatX);
  t.anisotropy = 4;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

const asphaltTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#33363b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5200; i++) {
    const v = randi(38, 76);
    g.fillStyle = 'rgb(' + v + ',' + v + ',' + (v + randi(0, 6)) + ')';
    g.fillRect(rand(0, w), rand(0, h), rand(1, 2.4), rand(1, 2.4));
  }
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = 'rgba(20,22,26,' + rand(0.15, 0.4) + ')';
    g.lineWidth = rand(0.5, 1.4);
    g.beginPath();
    let x = rand(0, w), y = rand(0, h);
    g.moveTo(x, y);
    for (let s = 0; s < 5; s++) { x += rand(-18, 18); y += rand(-18, 18); g.lineTo(x, y); }
    g.stroke();
  }
});

const concreteTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#9aa0a6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4200; i++) {
    const v = randi(138, 178);
    g.fillStyle = 'rgb(' + v + ',' + v + ',' + (v - 4) + ')';
    g.fillRect(rand(0, w), rand(0, h), rand(1, 2.6), rand(1, 2.6));
  }
  g.strokeStyle = 'rgba(90,94,100,.5)'; g.lineWidth = 2;
  g.strokeRect(1, 1, w - 2, h - 2);
});

const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3f6b34'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) {
    const v = randi(-24, 26);
    g.fillStyle = 'rgb(' + (63 + v) + ',' + (107 + v) + ',' + (52 + v * 0.6) + ')';
    g.fillRect(rand(0, w), rand(0, h), rand(1, 2.2), rand(1, 3.4));
  }
});

function makeFacade(base, winCols, winRows, litRatio, winTone) {
  const W = 256, H = 320;
  const cw = W / winCols, ch = H / winRows;
  const day = document.createElement('canvas'); day.width = W; day.height = H;
  const night = document.createElement('canvas'); night.width = W; night.height = H;
  const dg = day.getContext('2d'), ng = night.getContext('2d');
  dg.fillStyle = base; dg.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) {
    dg.fillStyle = 'rgba(0,0,0,' + rand(0.02, 0.07) + ')';
    dg.fillRect(rand(0, W), 0, rand(2, 9), H);
  }
  ng.fillStyle = '#000'; ng.fillRect(0, 0, W, H);
  for (let r = 0; r < winRows; r++) {
    for (let c = 0; c < winCols; c++) {
      const x = c * cw + cw * 0.18, y = r * ch + ch * 0.2, ww = cw * 0.64, wh = ch * 0.58;
      const shade = randi(18, 34);
      dg.fillStyle = 'rgb(' + shade + ',' + (shade + 4) + ',' + (shade + 12) + ')';
      dg.fillRect(x, y, ww, wh);
      dg.fillStyle = 'rgba(255,255,255,' + rand(0.04, 0.12) + ')';
      dg.fillRect(x, y, ww, wh * rand(0.2, 0.5));
      dg.strokeStyle = 'rgba(0,0,0,.35)'; dg.lineWidth = 1; dg.strokeRect(x, y, ww, wh);
      if (chance(litRatio)) {
        const warm = chance(0.8);
        ng.fillStyle = warm ? (winTone || '#ffd98a') : '#bfe0ff';
        ng.globalAlpha = rand(0.5, 1);
        ng.fillRect(x, y, ww, wh);
        ng.globalAlpha = 0.25; ng.fillStyle = '#000';
        if (chance(0.5)) ng.fillRect(x, y, ww, wh * rand(0.2, 0.45));
        ng.globalAlpha = 1;
      }
    }
  }
  const map = new THREE.CanvasTexture(day); map.encoding = THREE.sRGBEncoding;
  const emi = new THREE.CanvasTexture(night); emi.encoding = THREE.sRGBEncoding;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  emi.wrapS = emi.wrapT = THREE.RepeatWrapping;
  return { map, emi };
}

const ADS = [
  ['APEX COLA', 'Taste the skyline', '#e63946', '#fff3f3'],
  ['VOLT ENERGY', 'Own the night', '#ffd166', '#1a1a2e'],
  ['NIMBUS AIR', 'Fly beyond the grid', '#4cc9f0', '#0b2239'],
  ['METRO BANK', 'Your city. Your future.', '#8ecae6', '#023047'],
  ['BYTE BURGER', 'Open 24 hours', '#ff9f1c', '#2b2b2b'],
  ['LUMEN HOTELS', 'Sleep above the clouds', '#c77dff', '#240046'],
  ['ORBIT WATCHES', 'Time is a skyline', '#80ed99', '#081c15'],
  ['PULSE FM 99.1', 'The sound of Meridian', '#f72585', '#21041b'],
];
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function makeAdTexture(idx) {
  const ad = ADS[idx % ADS.length];
  const head = ad[0], sub = ad[1], fg = ad[2], bg = ad[3];
  return canvasTex(512, 256, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, bg); grad.addColorStop(1, shadeHex(bg, -30));
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 7; i++) {
      g.strokeStyle = hexA(fg, rand(0.08, 0.2)); g.lineWidth = rand(2, 9);
      g.beginPath(); g.arc(rand(0, w), rand(0, h), rand(20, 90), 0, TAU); g.stroke();
    }
    g.fillStyle = fg; g.font = 'bold 54px Arial'; g.textAlign = 'center';
    g.fillText(head, w / 2, h / 2 - 6);
    g.font = '26px Arial'; g.fillStyle = hexA(fg, 0.85);
    g.fillText(sub, w / 2, h / 2 + 40);
    g.strokeStyle = hexA(fg, 0.9); g.lineWidth = 6; g.strokeRect(8, 8, w - 16, h - 16);
  });
}
function makeNeonTexture(text, color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 512, 128);
  g.font = 'bold 72px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 26;
  g.strokeStyle = color; g.lineWidth = 3;
  g.strokeText(text, 256, 64);
  g.shadowBlur = 10; g.fillStyle = '#ffffff';
  g.fillText(text, 256, 64);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function makeStoreSign(text, bg, fg) {
  return canvasTex(512, 96, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = fg; g.font = 'bold 52px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, h / 2 + 2);
    g.strokeStyle = hexA(fg, 0.5); g.lineWidth = 4; g.strokeRect(4, 4, w - 8, h - 8);
  });
}
function makeRadialSprite(inner, outer) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  grad.addColorStop(0, inner); grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const cloudTex = makeRadialSprite('rgba(255,255,255,.85)', 'rgba(255,255,255,0)');
const glowTex = makeRadialSprite('rgba(255,225,150,.9)', 'rgba(255,225,150,0)');
const rainTex = (function () {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 64);
  grad.addColorStop(0, 'rgba(180,200,230,0)');
  grad.addColorStop(0.5, 'rgba(180,200,230,.55)');
  grad.addColorStop(1, 'rgba(180,200,230,0)');
  g.fillStyle = grad; g.fillRect(3, 0, 2, 64);
  return new THREE.CanvasTexture(c);
})();

/* ============================================================
   Renderer, scene, camera, sky, lights
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9db3c8, 120, 980);

const camera = new THREE.PerspectiveCamera(66, window.innerWidth / window.innerHeight, 0.1, 4200);

const skyUniforms = {
  topColor: { value: new THREE.Color(0x2e5d9e) },
  bottomColor: { value: new THREE.Color(0xcfd8e3) },
  sunDir: { value: new THREE.Vector3(0, 1, 0) },
  sunColor: { value: new THREE.Color(0xfff2cc) },
  sunIntensity: { value: 1.0 },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: [
    'uniform vec3 topColor; uniform vec3 bottomColor; uniform vec3 sunDir; uniform vec3 sunColor; uniform float sunIntensity;',
    'varying vec3 vP;',
    'void main(){',
    '  vec3 d = normalize(vP);',
    '  float h = clamp(d.y, -0.08, 1.0);',
    '  vec3 col = mix(bottomColor, topColor, pow(max(h,0.0), 0.62));',
    '  float s = max(dot(d, normalize(sunDir)), 0.0);',
    '  col += sunColor * (pow(s, 350.0) * 1.4 + pow(s, 24.0) * 0.28) * sunIntensity;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}',
  ].join('\n'),
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3400, 28, 14), skyMat);
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
{
  const pos = [];
  for (let i = 0; i < 900; i++) {
    const th = rand(0, TAU), ph = Math.acos(rand(0.02, 1));
    const r = 3200;
    pos.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
  }

function mergeGeoms(geoms) {
  const pos = [], nor = [], uv = [];
  for (let g0 of geoms) {
    const g = g0.index ? g0.toNonIndexed() : g0;
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    for (let i = 0; i < p.count; i++) {
      pos.push(p.getX(i), p.getY(i), p.getZ(i));
      nor.push(n.getX(i), n.getY(i), n.getZ(i));
      uv.push(u ? u.getX(i) : 0, u ? u.getY(i) : 0);
    }
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return out;
}
function boxG(w, h, d, x, y, z, ry) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Matrix4();
  if (ry) m.makeRotationY(ry);
  m.setPosition(x, y, z);
  g.applyMatrix4(m);
  return g;
}
function texBoxG(w, h, d, x, y, z, uw, vh) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uvA = g.attributes.uv;
  for (let i = 0; i < uvA.count; i++) uvA.setXY(i, uvA.getX(i) * uw, uvA.getY(i) * vh);
  const m = new THREE.Matrix4();
  m.setPosition(x, y, z);
  g.applyMatrix4(m);
  return g;
}
const _dummy = new THREE.Object3D();
function instMesh(geom, mat, transforms, castShadow) {
  const im = new THREE.InstancedMesh(geom, mat, transforms.length);
  transforms.forEach((t, i) => {
    _dummy.position.set(t.p[0], t.p[1], t.p[2]);
    _dummy.rotation.set(0, t.ry || 0, 0);
    const s = t.s || [1, 1, 1];
    _dummy.scale.set(s[0], s[1], s[2]);
    _dummy.updateMatrix();
    im.setMatrixAt(i, _dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = !!castShadow;
  im.receiveShadow = false;
  scene.add(im);
  return im;
}

const SIGNAL_P = 14;
function signalState(k, l, t) {
  const phase = (k * 7 + l * 13) % SIGNAL_P;
  const local = (t + phase) % SIGNAL_P;
  if (local < 5.5) return { ns: 'green', ew: 'red' };
  if (local < 6.5) return { ns: 'yellow', ew: 'red' };
  if (local < 7) return { ns: 'red', ew: 'red' };
  if (local < 12.5) return { ns: 'red', ew: 'green' };
  if (local < 13.5) return { ns: 'red', ew: 'yellow' };
  return { ns: 'red', ew: 'red' };
}
const signalLampRefs = []; // {k,l,nsIdx:[r,y,g],ewIdx:[r,y,g]}
let signalLampMesh = null;
{
  const poleT = [], armT = [], headT = [];
  const lampT = [];
  for (let k = 1; k < N; k++) for (let l = 1; l < N; l++) {
    if ((k + l) % 2 !== 0) continue;
    const x = nodePos(k), z = nodePos(l);
    signalInters.push({ k, l });
    // NS head: pole at NE corner, arm over road facing south
    poleT.push({ p: [x + 8.2, 2.75, z + 8.2] });
    armT.push({ p: [x + 8.2, 5.4, z + 5.9] });
    headT.push({ p: [x + 8.2, 4.9, z + 3.8] });
    const nsIdx = [];
    for (let s = 0; s < 3; s++) { nsIdx.push(lampT.length); lampT.push({ p: [x + 8.2, 5.18 - s * 0.28, z + 3.66] }); }
    // EW head: pole at SW corner
    poleT.push({ p: [x - 8.2, 2.75, z - 8.2] });
    armT.push({ p: [x - 5.9, 5.4, z - 8.2], ry: Math.PI / 2 });
    headT.push({ p: [x - 3.8, 4.9, z - 8.2], ry: Math.PI / 2 });
    const ewIdx = [];
    for (let s = 0; s < 3; s++) { ewIdx.push(lampT.length); lampT.push({ p: [x - 3.66, 5.18 - s * 0.28, z - 8.2] }); }
    signalLampRefs.push({ k, l, nsIdx, ewIdx });
  }
  instMesh(new THREE.CylinderGeometry(0.07, 0.09, 5.5, 6), MAT.steel, poleT);
  instMesh(new THREE.BoxGeometry(0.08, 0.08, 4.6), MAT.steel, armT);
  instMesh(new THREE.BoxGeometry(0.34, 0.95, 0.24), MAT.dark, headT);
  signalLampMesh = instMesh(new THREE.SphereGeometry(0.09, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, fog: false }), lampT);
  signalLampMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(lampT.length * 3).fill(0.06), 3);
}
function updateSignalLamps(t) {
  if (!signalLampMesh) return;
  const c = new THREE.Color();
  for (const ref of signalLampRefs) {
    const st = signalState(ref.k, ref.l, t);
    const pairs = [[ref.nsIdx, st.ns], [ref.ewIdx, st.ew]];
    for (const [idxs, state] of pairs) {
      c.setHex(state === 'red' ? 0xff2211 : 0x141414); signalLampMesh.setColorAt(idxs[0], c);
      c.setHex(state === 'yellow' ? 0xffbb11 : 0x141414); signalLampMesh.setColorAt(idxs[1], c);
      c.setHex(state === 'green' ? 0x22ff55 : 0x141414); signalLampMesh.setColorAt(idxs[2], c);
    }
  }
  signalLampMesh.instanceColor.needsUpdate = true;
}

function addTower(cx, cz) {

    facadeGeoms[(variant + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th;
    if (t < tiers - 1) { w *= rand(0.78, 0.9); d *= rand(0.78, 0.9); }
  }
  roofGeoms.push(boxG(w + 0.6, 0.5, d + 0.6, cx, y + 0.25, cz));

function addSpire(cx, cz) {
  let y = 0, w = 26, d = 22;

  for (let t = 0; t < heights.length; t++) {
    const th = heights[t];
    facadeGeoms[(3 + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th; w *= 0.82; d *= 0.82;
  }
  roofGeoms.push(boxG(w + 1, 0.6, d + 1, cx, y + 0.3, cz));
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 26, 8), MAT.steel);

function addTower(cx, cz) {
  const variant = randi(0, FACADES.length - 1);
  const tiers = randi(2, 3);
  const totalH = randi(7, 15) * 3.4;
  let y = 0, w = rand(20, 28), d = rand(18, 24);
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? (totalH - y) : totalH / tiers;
    facadeGeoms[(variant + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th;
    if (t < tiers - 1) { w *= rand(0.78, 0.9); d *= rand(0.78, 0.9); }
  }
  roofGeoms.push(boxG(w + 0.6, 0.5, d + 0.6, cx, y + 0.25, cz));
  addCollider(cx - w / 2 - 0.4, cz - d / 2 - 0.4, cx + w / 2 + 0.4, cz + d / 2 + 0.4, 0, y + 2);
  const nAC = randi(1, 3);
  for (let i = 0; i < nAC; i++) acUnits.push({ p: [cx + rand(-w / 3, w / 3), y + 0.75, cz + rand(-d / 3, d / 3)], ry: rand(0, TAU), s: [rand(1, 1.8), rand(0.7, 1.1), rand(1, 1.6)] });
  if (chance(0.35)) addWaterTower(cx + rand(-w / 4, w / 4), cz + rand(-d / 4, d / 4), y);
  if (chance(0.5)) addFireEscape(cx, cz, w, d, y);
  if (chance(0.45)) addBillboard(cx, cz + d / 2 + 0.2, y, 0);
  if (chance(0.35)) addNeon(pick(['HOTEL', 'BAR', 'CLUB', 'NOODLES', 'LIQUOR', 'PAWN']), cx - w / 2 - 0.16, rand(4, Math.max(5, Math.min(9, y - 2))), cz, -Math.PI / 2);
  return y;
}

function addTower(cx, cz) {
  const variant = randi(0, FACADES.length - 1);
  const tiers = randi(2, 3);
  const totalH = randi(7, 15) * 3.4;
  let y = 0, w = rand(20, 28), d = rand(18, 24);
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? (totalH - y) : totalH / tiers;
    facadeGeoms[(variant + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th;
    if (t < tiers - 1) { w *= rand(0.78, 0.9); d *= rand(0.78, 0.9); }
  }
  roofGeoms.push(boxG(w + 0.6, 0.5, d + 0.6, cx, y + 0.25, cz));
  addCollider(cx - w / 2 - 0.4, cz - d / 2 - 0.4, cx + w / 2 + 0.4, cz + d / 2 + 0.4, 0, y + 2);
  const nAC = randi(1, 3);
  for (let i = 0; i < nAC; i++) acUnits.push({ p: [cx + rand(-w / 3, w / 3), y + 0.75, cz + rand(-d / 3, d / 3)], ry: rand(0, TAU), s: [rand(1, 1.8), rand(0.7, 1.1), rand(1, 1.6)] });
  if (chance(0.35)) addWaterTower(cx + rand(-w / 4, w / 4), cz + rand(-d / 4, d / 4), y);
  if (chance(0.5)) addFireEscape(cx, cz, w, d, y);

}

function addTower(cx, cz) {
  const variant = randi(0, FACADES.length - 1);
  const tiers = randi(2, 3);
  const totalH = randi(7, 15) * 3.4;
  let y = 0, w = rand(20, 28), d = rand(18, 24);
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? (totalH - y) : totalH / tiers;
    facadeGeoms[(variant + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th;
    if (t < tiers - 1) { w *= rand(0.78, 0.9); d *= rand(0.78, 0.9); }
  }
  roofGeoms.push(boxG(w + 0.6, 0.5, d + 0.6, cx, y + 0.25, cz));
  addCollider(cx - w / 2 - 0.4, cz - d / 2 - 0.4, cx + w / 2 + 0.4, cz + d / 2 + 0.4, 0, y + 2);
  const nAC = randi(1, 3);
  for (let i = 0; i < nAC; i++) acUnits.push({ p: [cx + rand(-w / 3, w / 3), y + 0.75, cz + rand(-d / 3, d / 3)], ry: rand(0, TAU), s: [rand(1, 1.8), rand(0.7, 1.1), rand(1, 1.6)] });
  if (chance(0.35)) addWaterTower(cx + rand(-w / 4, w / 4), cz + rand(-d / 4, d / 4), y);
  if (chance(0.5)) addFireEscape(cx, cz, w, d, y);
  if (chance(0.45)) addBillboard(cx, cz + d / 2 + 0.2, y, 0);
  if (chance(0.35)) addNeon(pick(['HOTEL', 'BAR', 'CLUB', 'NOODLES', 'LIQUOR', 'PAWN']), cx - w / 2 - 0.16, rand(4, Math.max(5, Math.min(9, y - 2))), cz, -Math.PI / 2);
  return y;
}

function addTower(cx, cz) {
  const variant = randi(0, FACADES.length - 1);
  const tiers = randi(2, 3);
  const totalH = randi(7, 15) * 3.4;
  let y = 0, w = rand(20, 28), d = rand(18, 24);
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? (totalH - y) : totalH / tiers;
    facadeGeoms[(variant + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th;
    if (t < tiers - 1) { w *= rand(0.78, 0.9); d *= rand(0.78, 0.9); }
  }
  roofGeoms.push(boxG(w + 0.6, 0.5, d + 0.6, cx, y + 0.25, cz));
  addCollider(cx - w / 2 - 0.4, cz - d / 2 - 0.4, cx + w / 2 + 0.4, cz + d / 2 + 0.4, 0, y + 2);
  const nAC = randi(1, 3);
  for (let i = 0; i < nAC; i++) acUnits.push({ p: [cx + rand(-w / 3, w / 3), y + 0.75, cz + rand(-d / 3, d / 3)], ry: rand(0, TAU), s: [rand(1, 1.8), rand(0.7, 1.1), rand(1, 1.6)] });
  if (chance(0.35)) addWaterTower(cx + rand(-w / 4, w / 4), cz + rand(-d / 4, d / 4), y);
  if (chance(0.5)) addFireEscape(cx, cz, w, d, y);
  if (chance(0.45)) addBillboard(cx, cz + d / 2 + 0.2, y, 0);
  if (chance(0.35)) addNeon(pick(['HOTEL', 'BAR', 'CLUB', 'NOODLES', 'LIQUOR', 'PAWN']), cx - w / 2 - 0.16, rand(4, Math.max(5, Math.min(9, y - 2))), cz, -Math.PI / 2);
  return y;
}

function addSpire(cx, cz) {

function addTower(cx, cz) {
  const variant = randi(0, FACADES.length - 1);
  const tiers = randi(2, 3);
  const totalH = randi(7, 15) * 3.4;
  let y = 0, w = rand(20, 28), d = rand(18, 24);
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? (totalH - y) : totalH / tiers;
    facadeGeoms[(variant + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th;
    if (t < tiers - 1) { w *= rand(0.78, 0.9); d *= rand(0.78, 0.9); }
  }
  roofGeoms.push(boxG(w + 0.6, 0.5, d + 0.6, cx, y + 0.25, cz));
  addCollider(cx - w / 2 - 0.4, cz - d / 2 - 0.4, cx + w / 2 + 0.4, cz + d / 2 + 0.4, 0, y + 2);
  const nAC = randi(1, 3);
  for (let i = 0; i < nAC; i++) acUnits.push({ p: [cx + rand(-w / 3, w / 3), y + 0.75, cz + rand(-d / 3, d / 3)], ry: rand(0, TAU), s: [rand(1, 1.8), rand(0.7, 1.1), rand(1, 1.6)] });
  if (chance(0.35)) addWaterTower(cx + rand(-w / 4, w / 4), cz + rand(-d / 4, d / 4), y);
  if (chance(0.5)) addFireEscape(cx, cz, w, d, y);
  if (chance(0.45)) addBillboard(cx, cz + d / 2 + 0.2, y, 0);
  if (chance(0.35)) addNeon(pick(['HOTEL', 'BAR', 'CLUB', 'NOODLES', 'LIQUOR', 'PAWN']), cx - w / 2 - 0.16, rand(4, Math.max(5, Math.min(9, y - 2))), cz, -Math.PI / 2);
  return y;
}

function addResBlock(i, j, cx, cz) {
  const key = i + ':' + j;
  if (STAIR_BLOCKS[key]) {
    addStairHouse(cx - 8, cz - 6);
    addHouse(cx + 9, cz + 8);
    addTree(cx + 12, cz - 12);
    return;
  }
  const nH = randi(2, 3);
  const spots = [[-11, -10], [10, -9], [-9, 11], [11, 10]];
  for (let s = 0; s < nH; s++) {
    const sp = spots[s];
    addHouse(cx + sp[0] + rand(-2, 2), cz + sp[1] + rand(-2, 2));
  }
  if (chance(0.7)) addTree(cx + rand(-18, 18), cz + rand(-18, 18));
  if (chance(0.5)) addTree(cx + rand(-18, 18), cz + rand(-18, 18));
  if (chance(0.35)) hydrantT.push({ p: [nodePos(i) + ROAD_W / 2 + 1.7, 0.35, nodePos(j) + ROAD_W / 2 + 1.7] });

// ---------- finalize instanced props ----------
function finalizeProps() {
  for (let f = 0; f < FACADES.length; f++) {
    if (!facadeGeoms[f].length) continue;
    const m = new THREE.Mesh(mergeGeoms(facadeGeoms[f]), FACADES[f]);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
  }
  if (roofGeoms.length) {
    const r = new THREE.Mesh(mergeGeoms(roofGeoms), MAT.roofDark);
    r.castShadow = true; r.receiveShadow = true;
    scene.add(r);
  }
  if (acUnits.length) instMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x9aa2ab, roughness: 0.6, metalness: 0.5 }), acUnits, true);
  if (dumpsterT.length) instMesh(new THREE.BoxGeometry(2.2, 1.3, 1.2), MAT.dumpster, dumpsterT, true);
  if (barrierT.length) instMesh(new THREE.BoxGeometry(2, 1, 0.4), MAT.barrier, barrierT, true);
  if (hydrantT.length) instMesh(new THREE.CylinderGeometry(0.16, 0.19, 0.75, 8), new THREE.MeshStandardMaterial({ color: 0xb03024, roughness: 0.6 }), hydrantT, true);
  if (benchT.length) {
    instMesh(new THREE.BoxGeometry(1.8, 0.12, 0.55), MAT.wood, benchT.map(b => ({ p: [b.x, 0.45, b.z], ry: b.ry })), true);
    instMesh(new THREE.BoxGeometry(1.8, 0.55, 0.1), MAT.wood, benchT.map(b => ({
      p: [b.x - 0.3 * Math.sin(b.ry), 0.85, b.z - 0.3 * Math.cos(b.ry)], ry: b.ry,
    })), true);
  }
  if (barrierT.length) { /* already instanced above */ }
  if (productBoxes.length) {
    const pm = new THREE.InstancedMesh(new THREE.BoxGeometry(0.45, 0.4, 0.35), new THREE.MeshStandardMaterial({ roughness: 0.7 }), productBoxes.length);
    productBoxes.forEach((p, i) => {
      _dummy.position.set(p.p[0], p.p[1], p.p[2]);
      _dummy.rotation.set(0, 0, 0);
      _dummy.scale.set(1, 1, 1);
      _dummy.updateMatrix();
      pm.setMatrixAt(i, _dummy.matrix);
      pm.setColorAt(i, p.c);
    });
    pm.instanceColor.needsUpdate = true;
    scene.add(pm);
  }
  if (dumpsterT.length) { /* done above */ }
}

// ---------- build orchestration ----------
async function buildCity() {
  setLoad(12, 'paving streets…');
  await yieldFrame();
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const t = blockType[i][j];
      const cx = blockCenter(i), cz = blockCenter(j);
      if (t === 'tower') addTower(cx + rand(-4, 4), cz + rand(-4, 4));
      else if (t === 'res') addResBlock(i, j, cx, cz);
      else if (t === 'park') addPark(cx, cz);
      else if (t === 'industrial') addIndustrial(cx, cz);
      else if (t === 'construction') addConstruction(cx, cz);
      else if (t === 'gas') addGas(cx, cz);
      else if (t === 'parking') addParking(cx, cz);
      else if (t === 'store') addStore(cx, cz, i * N + j);
      else if (t === 'spire') addSpire(cx, cz);
    }
    setLoad(12 + Math.round((i / N) * 45), 'raising the ' + (i < 6 ? 'west' : 'east') + ' side…');
    await yieldFrame();
  }
  setLoad(62, 'rooftop equipment…');
  await yieldFrame();
  finalizeProps();
  plantTrees();
  addHighway();
  addTunnel();
  addSkyline();
  populateParking();
  bucketColliders();
  buildMinimapBg();
  setLoad(80, 'wiring the grid…');
  await yieldFrame();
}

// ---------- minimap background ----------
let mapBg = null;
function buildMinimapBg() {
  const c = document.createElement('canvas');
  c.width = c.height = 340;
  const g = c.getContext('2d');
  const s = 340 / (SPAN + 80);
  const W2 = (x) => (x + HALF + 40) * s;
  g.fillStyle = '#0d1420'; g.fillRect(0, 0, 340, 340);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const t = blockType[i][j];
    if (t === 'park') g.fillStyle = '#1e3a22';
    else if (t === 'industrial') g.fillStyle = '#232a33';
    else if (t === 'tower' || t === 'spire') g.fillStyle = '#1b2331';
    else g.fillStyle = '#161d29';
    g.fillRect(W2(nodePos(i) + ROAD_W / 2), W2(nodePos(j) + ROAD_W / 2), (TILE - ROAD_W) * s, (TILE - ROAD_W) * s);

  car.mesh.position.set(car.pos.x, groundHeightAt(car.pos.x, car.pos.z), car.pos.z);
  car.mesh.rotation.y = car.heading;
  for (const w of car.mesh.userData.wheels) w.rotation.x += car.speed * dt / 0.36;
}

// parked cars in parking lots and along a few curbs
function parkCar(x, z, ry, kind) {
  const mesh = buildCar(kind === 'taxi' ? 0xf2c014 : pick(CAR_COLORS), kind === 'taxi' ? { taxi: true } : {});
  mesh.position.set(x, 0, z);
  mesh.rotation.y = ry;
  scene.add(mesh);
  const car = { kind: 'parked', mesh, pos: new THREE.Vector3(x, 0, z), heading: ry, speed: 0, isCar: true, parked: true };
  parkedCarList.push(car);
  addCollider(x - 1.15, z - 2.3, x + 1.15, z + 2.3, 0, 2);
  return car;
}
function populateParking() {
  for (const lot of parkingLots) {
    const cols = 6, rows = 3, gap = 4.2;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (!chance(0.55)) continue;
      parkCar(lot.x - (cols - 1) * gap / 2 + c * gap, lot.z - 8 + r * 8, Math.PI / 2);
    }
  }
  // a few curbside parked cars downtown
  for (let i = 0; i < 10; i++) {
    const k = randi(3, 8), along = rand(-HALF + 40, HALF - 40);
    const c = nodePos(k);
    if (chance(0.5)) parkCar(along, c - (ROAD_W / 2 + 1.6), Math.PI / 2);
    else parkCar(c - (ROAD_W / 2 + 1.6), along, 0);
  }
}

function addSpire(cx, cz) {
  let y = 0, w = 26, d = 22;
  const heights = [50, 40, 30, 20];
  for (let t = 0; t < heights.length; t++) {
    const th = heights[t];
    facadeGeoms[(3 + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th; w *= 0.82; d *= 0.82;
  }
  roofGeoms.push(boxG(w + 1, 0.6, d + 1, cx, y + 0.3, cz));

async function buildCity() {
  setLoad(12, 'paving streets…');
  await yieldFrame();
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const t = blockType[i][j];
      const cx = blockCenter(i), cz = blockCenter(j);
      if (t === 'tower') addTower(cx + rand(-4, 4), cz + rand(-4, 4));
      else if (t === 'res') addResBlock(i, j, cx, cz);
      else if (t === 'park') addPark(cx, cz);
      else if (t === 'industrial') addIndustrial(cx, cz);
      else if (t === 'construction') addConstruction(cx, cz);
      else if (t === 'gas') addGas(cx, cz);
      else if (t === 'parking') addParking(cx, cz);
      else if (t === 'store') addStore(cx, cz, i * N + j);
      else if (t === 'spire') addSpire(cx, cz);
    }
    setLoad(12 + Math.round((i / N) * 45), 'raising the city…');
    await yieldFrame();
  }
  setLoad(62, 'rooftop equipment…');
  await yieldFrame();
  finalizeProps();
  plantTrees();
  addHighway();
  addTunnel();
  addSkyline();
  populateParking();
  bucketColliders();
  buildMinimapBg();
  setLoad(80, 'wiring the grid…');
  await yieldFrame();
}

function buildMinimapBg() {
  const c = document.createElement('canvas');
  c.width = c.height = 340;
  const g = c.getContext('2d');
  const s = 340 / (SPAN + 80);
  const W2 = (x) => (x + HALF + 40) * s;
  g.fillStyle = '#0d1420'; g.fillRect(0, 0, 340, 340);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const t = blockType[i][j];
    if (t === 'park') g.fillStyle = '#1e3a22';
    else if (t === 'industrial') g.fillStyle = '#232a33';
    else if (t === 'tower' || t === 'spire') g.fillStyle = '#1b2331';
    else g.fillStyle = '#161d29';
    g.fillRect(W2(nodePos(i) + ROAD_W / 2), W2(nodePos(j) + ROAD_W / 2), (TILE - ROAD_W) * s, (TILE - ROAD_W) * s);
  }
  g.strokeStyle = '#3d4a5c'; g.lineWidth = Math.max(1.5, ROAD_W * s * 0.7);
  for (let k = 0; k <= N; k++) {
    const cc = W2(nodePos(k));
    g.beginPath(); g.moveTo(W2(-HALF), cc); g.lineTo(W2(HALF), cc); g.stroke();
    g.beginPath(); g.moveTo(cc, W2(-HALF)); g.lineTo(cc, W2(HALF)); g.stroke();
  }
  g.strokeStyle = '#c98f2e'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(W2(-350), W2(HWY_Z)); g.lineTo(W2(350), W2(HWY_Z)); g.stroke();
  g.fillStyle = '#5c6b7d';
  g.fillRect(W2(-7) - 2, W2(66), 4, (114 - 66) * s);
  g.fillStyle = '#4cc9f0';
  for (const st of stores) { g.beginPath(); g.arc(W2(st.x), W2(st.z), 3, 0, TAU); g.fill(); }
  mapBg = c;
}

const SIDEWALK = ROAD_W / 2 + 1.5; // sidewalk centerline offset from road center

function sidewalkPoint() {
  // random point on a sidewalk edge: just inside a random block edge
  const i = randi(0, N - 1), j = randi(0, N - 1);
  const side = randi(0, 3);
  const bx0 = nodePos(i) + ROAD_W / 2 + 1.5, bx1 = nodePos(i + 1) - ROAD_W / 2 - 1.5;
  const bz0 = nodePos(j) + ROAD_W / 2 + 1.5, bz1 = nodePos(j + 1) - ROAD_W / 2 - 1.5;
  if (side === 0) return { x: rand(bx0, bx1), z: bz0 };
  if (side === 1) return { x: rand(bx0, bx1), z: bz1 };
  if (side === 2) return { x: bx0, z: rand(bz0, bz1) };
  return { x: bx1, z: rand(bz0, bz1) };
}

function updatePed(ped, dt, tSim) {
  const m = ped.mesh;
  if (ped.dead) {
    ped.deadT += dt;
    const k = Math.min(1, ped.deadT * 2.5);
    m.rotation.x = -Math.PI / 2 * k; // fall over
    m.position.y = ped.pos.y + 0.2 * k;
    return;
  }
  if (ped.static) {
    // clerk idles behind the counter
    m.userData.armL.rotation.x = Math.sin(tSim * 1.2) * 0.08;
    m.userData.armR.rotation.x = -Math.sin(tSim * 1.2) * 0.08;
    return;
  }
  // threat check: speeding player car or wanted player on foot
  let threat = null;
  if (playerCar && playerCar.driving && Math.abs(playerCar.speed) > 6) {
    const d = Math.hypot(playerCar.pos.x - ped.pos.x, playerCar.pos.z - ped.pos.z);
    if (d < 12) threat = playerCar.pos;
  }
  if (!threat && wanted.level >= 2 && !player.hidden) {
    const d = Math.hypot(player.pos.x - ped.pos.x, player.pos.z - ped.pos.z);
    if (d < 10) threat = player.pos;
  }
  if (!threat && hornPanicT > 0 && !player.hidden) {
    const hp = playerCar && playerCar.driving ? playerCar.pos : player.pos;
    if (Math.hypot(hp.x - ped.pos.x, hp.z - ped.pos.z) < 18) threat = hp;
  }
  if (threat) {
    ped.state = 'flee';
    ped.fleeFrom = { x: threat.x, z: threat.z };
    ped.fleeT = 2.5;
  }
  let speed = ped.speed;
  if (ped.state === 'flee') {
    speed = ped.speed * 2.6;
    ped.fleeT -= dt;
    if (ped.fleeT <= 0) { ped.state = 'walk'; ped.target = sidewalkPoint(); }
    const dx = ped.pos.x - ped.fleeFrom.x, dz = ped.pos.z - ped.fleeFrom.z;
    const d = Math.hypot(dx, dz) || 1;
    ped.pos.x += (dx / d) * speed * dt;
    ped.pos.z += (dz / d) * speed * dt;
    ped.ry = Math.atan2(dx, dz);
  } else {
    const dx = ped.target.x - ped.pos.x, dz = ped.target.z - ped.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < 1.2) { ped.target = sidewalkPoint(); }
    else {
      ped.pos.x += (dx / d) * speed * dt;
      ped.pos.z += (dz / d) * speed * dt;
      ped.ry = Math.atan2(dx, dz);
    }
  }
  const res = resolveCollision(ped.pos.x, ped.pos.z, 0.35, ped.pos.y + 0.5);
  ped.pos.x = res.x; ped.pos.z = res.z;
  ped.pos.y = groundHeightAt(ped.pos.x, ped.pos.z);
  ped.walkPhase += speed * dt * 4.2;
  const sw = Math.sin(ped.walkPhase) * clamp(speed / 2, 0.25, 1) * 0.6;
  m.userData.legL.rotation.x = sw;
  m.userData.legR.rotation.x = -sw;
  m.userData.armL.rotation.x = -sw * 0.7;
  m.userData.armR.rotation.x = sw * 0.7;
  m.position.set(ped.pos.x, ped.pos.y, ped.pos.z);
  m.rotation.y = ped.ry;
}

function spawnPeds() {
  for (let i = 0; i < 34; i++) {
    const p = sidewalkPoint();
    spawnPed(p.x, p.z);
  }
  for (const st of stores) {
    spawnPed(st.clerkX, st.clerkZ, { static: true, ry: st.clerkRy, clerk: true });
  }
}

function updateHeli(dt, tSim, night) {
  if (!heli) return;
  const m = heli.mesh;
  heli.t += dt;
  // patrol loop around downtown
  const huntWanted = wanted.level >= 3;
  if (!heli.active && (chance(0.0002) || (huntWanted && !heli.active && chance(0.01)))) {
    heli.active = true; m.visible = true; heli.t = 0;
  }
  if (!heli.active) return;
  m.userData.rotor.rotation.y += dt * 30;
  m.userData.tailRotor.rotation.x += dt * 40;
  let tx, tz, ty;
  if (huntWanted) {
    // orbit the player's general area
    const px = playerCar && playerCar.driving ? playerCar.pos.x : player.pos.x;
    const pz = playerCar && playerCar.driving ? playerCar.pos.z : player.pos.z;
    tx = px + Math.cos(heli.t * 0.25) * 55;
    tz = pz + Math.sin(heli.t * 0.25) * 55;
    ty = 70;
    m.userData.search.intensity = night ? 4 : 0;
    m.userData.search.target.position.set(px - m.position.x, -60, pz - m.position.z);
  } else {
    const r = 260;
    tx = Math.cos(heli.t * 0.05) * r;
    tz = Math.sin(heli.t * 0.05) * r;
    ty = rand(0, 1) > -1 ? 110 : 110;
    m.userData.search.intensity = 0;
    if (heli.t > 120) { heli.active = false; m.visible = false; return; }
  }
  const dx = tx - m.position.x, dz = tz - m.position.z, dy = ty - m.position.y;
  const d = Math.hypot(dx, dz) || 1;
  const sp = 28;
  m.position.x += (dx / d) * Math.min(sp * dt, Math.abs(dx));
  m.position.z += (dz / d) * Math.min(sp * dt, Math.abs(dz));
  m.position.y += clamp(dy, -6 * dt, 6 * dt);
  m.rotation.y = Math.atan2(dx, dz);
}

function updatePlane(dt, tSim) {
  if (!planeObj) return;
  const m = planeObj.mesh;
  if (!planeObj.active) {
    if (chance(0.0004)) {
      planeObj.active = true; planeObj.t = 0; m.visible = true;
      const ang = rand(0, TAU);
      planeObj.dir = { x: Math.cos(ang), z: Math.sin(ang) };
      m.position.set(-Math.cos(ang) * 2200, rand(280, 360), -Math.sin(ang) * 2200);
      m.rotation.y = Math.atan2(planeObj.dir.x, planeObj.dir.z) + Math.PI / 2;
    } else return;
  }
  planeObj.t += dt;
  m.position.x += planeObj.dir.x * 90 * dt;
  m.position.z += planeObj.dir.z * 90 * dt;
  m.userData.blinkMat.color.setHex(Math.floor(tSim * 1.4) % 2 === 0 ? 0xff4444 : 0x441111);
  if (Math.hypot(m.position.x, m.position.z) > 2400) { planeObj.active = false; m.visible = false; }
}

  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 24, 8), mat);
  body.rotation.z = Math.PI / 2;
  g.add(body);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(4, 0.3, 26), mat);

  const blink = new THREE.Mesh(new THREE.SphereGeometry(0.6, 6, 4), blinkMat);

  g.userData.blinkMat = blinkMat;
  g.visible = false;
  scene.add(g);
  return { mesh: g, active: false, t: 0, dir: { x: 1, z: 0 } };
}

function updateHeli(dt, tSim, night) {
  if (!heli) return;
  const m = heli.mesh;
  heli.t += dt;
  const huntWanted = wanted.level >= 3;
  if (!heli.active && (chance(0.0002) || (huntWanted && chance(0.01)))) {
    heli.active = true; m.visible = true; heli.t = 0;
  }
  if (!heli.active) return;
  m.userData.rotor.rotation.y += dt * 30;
  m.userData.tailRotor.rotation.x += dt * 40;
  let tx, tz, ty;
  if (wanted.level >= 3) {
    const px = playerCar && playerCar.driving ? playerCar.pos.x : player.pos.x;
    const pz = playerCar && playerCar.driving ? playerCar.pos.z : player.pos.z;
    tx = px + Math.cos(heli.t * 0.25) * 55;
    tz = pz + Math.sin(heli.t * 0.25) * 55;
    m.position.y += clamp(70 - m.position.y, -6 * dt, 6 * dt);
    m.userData.search.intensity = night ? 4 : 0;
    m.userData.search.target.position.set(
      (playerCar && playerCar.driving ? playerCar.pos.x : player.pos.x) - m.position.x,
      -60,
      (playerCar && playerCar.driving ? playerCar.pos.z : player.pos.z) - m.position.z);
    tx = (playerCar && playerCar.driving ? playerCar.pos.x : player.pos.x) + Math.cos(heli.t * 0.25) * 55;
    tz = (playerCar && playerCar.driving ? playerCar.pos.z : player.pos.z) + Math.sin(heli.t * 0.25) * 55;
  } else {
    const r = 260;
    tx = Math.cos(heli.t * 0.05) * r;
    tz = Math.sin(heli.t * 0.05) * r;
    m.userData.search.intensity = 0;
    if (heli.t > 120) { heli.active = false; m.visible = false; return; }
  }
  const dx = tx - m.position.x, dz = tz - m.position.z;
  const d = Math.hypot(dx, dz) || 1;
  const sp = 28;
  m.position.x += (dx / d) * Math.min(sp * dt, Math.abs(dx));
  m.position.z += (dz / d) * Math.min(sp * dt, Math.abs(dz));
  m.position.y += clamp((m.userData.search.intensity > 0 ? 70 : 110) - m.position.y, -6 * dt, 6 * dt);
  m.rotation.y = Math.atan2(tx - m.position.x, tz - m.position.z);
}

function updatePlane(dt, tSim) {
  if (!planeObj) return;
  const m = planeObj.mesh;
  if (!planeObj.active) {
    if (chance(0.0004)) {
      planeObj.active = true; planeObj.t = 0; m.visible = true;
      const ang = rand(0, TAU);
      planeObj.dir = { x: Math.cos(ang), z: Math.sin(ang) };
      m.position.set(-Math.cos(ang) * 2200, rand(280, 360), -Math.sin(ang) * 2200);
      m.rotation.y = Math.atan2(planeObj.dir.x, planeObj.dir.z) + Math.PI / 2;
    } else return;
  }
  planeObj.t += dt;
  m.position.x += planeObj.dir.x * 90 * dt;
  m.position.z += planeObj.dir.z * 90 * dt;
  m.userData.blinkMat.color.setHex(Math.floor(tSim * 1.4) % 2 === 0 ? 0xff4444 : 0x441111);
  if (Math.hypot(m.position.x, m.position.z) > 2400) { planeObj.active = false; m.visible = false; }
}

// ---------- camera ----------
let camYaw = 2.6, camPitch = 0.34, camMode = 0;
const CAM_DISTS = [6, 9.5, 14];

function updateCamera(dt) {
  const focus = (playerCar && playerCar.driving) ? playerCar.pos : player.pos;
  if (playerCar && playerCar.driving) {
    let dh = playerCar.heading - camYaw;
    while (dh > Math.PI) dh -= TAU; while (dh < -Math.PI) dh += TAU;
    camYaw += dh * Math.min(1, dt * 2.2);
  }
  const dist = CAM_DISTS[camMode] + ((playerCar && playerCar.driving) ? 2.5 + Math.abs(playerCar.speed) * 0.12 : 0);
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const dir = new THREE.Vector3(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch));
  const target = new THREE.Vector3(focus.x, focus.y + 1.7, focus.z);
  const desired = target.clone().addScaledVector(dir, -dist);
  desired.y = Math.max(desired.y, groundHeightAt(desired.x, desired.z) + 0.5);
  camera.position.lerp(desired, Math.min(1, dt * 6));
  camera.lookAt(target);
}

// ---------- on-foot ----------
function updateOnFoot(dt) {
  const f = { x: Math.sin(camYaw), z: Math.cos(camYaw) };
  const r = { x: f.z, z: -f.x };
  let mx = 0, mz = 0;
  if (keys['KeyW']) { mx += f.x; mz += f.z; }
  if (keys['KeyS']) { mx -= f.x; mz -= f.z; }
  if (keys['KeyD']) { mx += r.x; mz += r.z; }
  if (keys['KeyA']) { mx -= r.x; mz -= r.z; }
  const mlen = Math.hypot(mx, mz);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = mlen > 0 ? (sprint ? 6.6 : 3.3) : 0;
  if (mlen > 0) {
    mx /= mlen; mz /= mlen;
    player.pos.x += mx * speed * dt;
    player.pos.z += mz * speed * dt;
    player.heading = Math.atan2(mx, mz);
    player.walkPhase += speed * dt * 4.2;
  }
  player.speed2d = speed;
  const ground = groundHeightAt(player.pos.x, player.pos.z);
  if (keys['Space'] && player.onGround) { player.vy = 6.8; player.onGround = false; }
  player.vy -= 22 * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y <= ground) { player.pos.y = ground; player.vy = 0; player.onGround = true; }
  else player.onGround = false;
  const res = resolveCollision(player.pos.x, player.pos.z, 0.4, player.pos.y);
  player.pos.x = res.x; player.pos.z = res.z;
  // animate
  const m = player.mesh;
  if (speed > 0) {
    player.walkPhase += speed * 1.6 * dt * 4.2;
    const sw = Math.sin(player.walkPhase) * clamp(speed / 3, 0.3, 1) * 0.6;
    m.userData.legL.rotation.x = Math.sin(player.walkPhase) * clamp(1, 0.3, 1) * 0.6 * (sprint ? 1.2 : 1);
    m.userData.legL.rotation.x = Math.sin(player.walkPhase) * (sprint ? 0.75 : 0.5);
    m.userData.legR.rotation.x = -m.userData.legL.rotation.x;
    m.userData.armL.rotation.x = -m.userData.legL.rotation.x * 0.8;
    m.userData.armR.rotation.x = -m.userData.legR.rotation.x * 0.8;
    let dh = player.heading - m.rotation.y;
    while (dh > Math.PI) dh -= TAU; while (dh < -Math.PI) dh += TAU;
    m.rotation.y += dh * Math.min(1, dt * 12);
  } else {
    m.userData.legL.rotation.x *= 0.8; m.userData.legR.rotation.x *= 0.8;
    m.userData.armL.rotation.x *= 0.8; m.userData.armR.rotation.x *= 0.8;
  }
  m.position.copy(player.pos);
}

// ---------- driving ----------
function nearestEnterableCar() {
  let best = null, bestD = 4.2;
  const consider = (car) => {
    if (car.kind === 'police' && car.target) return;
    if (car.speed !== undefined && Math.abs(car.speed) > 2.5) return;
    const d = Math.hypot(car.pos.x - player.pos.x, car.pos.z - player.pos.z);
    if (d < bestD) { bestD = d; best = car; }
  };
  for (const c of trafficCars) consider(c);
  for (const c of parkedCarList) consider(c);
  if (playerCar && !playerCar.driving) consider(playerCar);
  return best;
}

function toggleEnterCar() {
  if (playerCar && playerCar.driving) { exitCar(); return; }
  const car = nearestEnterableCar();
  if (!car) return;
  enterCar(car);
}

function enterCar(car) {
  if (car.parked) {
    // un-park: free the curb spot, no collider to remove since parked colliders are static-ish; acceptable
    car.parked = false;
  } else {
    const idx = trafficCars.indexOf(car);
    if (idx >= 0) {
      trafficCars.splice(idx, 1);
      if (car.kind !== 'police') addWanted(1, 'Vehicle stolen');
      else addWanted(2, 'Police vehicle stolen');
    }
  }
  car.driving = true;
  playerCar = car;
  player.hidden = true;
  player.mesh.visible = false;
  showMsg(car.kind === 'taxi' ? 'Taxi "borrowed"' : 'Vehicle acquired');
}

function exitCar() {
  if (!playerCar) return;
  const car = playerCar;
  car.driving = false;
  car.speed = 0;
  const side = { x: Math.cos(car.heading), z: -Math.sin(car.heading) };
  player.pos.set(car.pos.x + side.x * 2.2, car.pos.y, car.pos.z + side.z * 2.2);
  player.pos.y = groundHeightAt(player.pos.x, player.pos.z);
  player.vy = 0;
  player.hidden = false;
  player.mesh.visible = true;
  player.mesh.position.copy(player.pos);
  headlight.visible = false;
}

function updateDriving(dt) {
  const car = playerCar;
  const fwd = keys['KeyW'] ? 1 : 0;
  const back = keys['KeyS'] ? 1 : 0;
  const steerIn = (keys['KeyA'] ? 1 : 0) - (keys['KeyD'] ? 1 : 0);
  const hand = keys['Space'];
  const maxF = 34, maxR = -7;
  let accel = 0;
  if (fwd) accel += 9.5;
  if (back) accel -= car.speed > 0.5 ? 16 : 6.5;
  if (hand) accel -= Math.sign(car.speed) * 22;
  accel -= car.speed * 0.35; // drag
  car.speed += accel * dt;
  car.speed = clamp(car.speed, maxR, maxF);
  if (!fwd && !back && !hand && Math.abs(car.speed) < 0.25) car.speed = 0;
  const grip = 1 - weather.wet * 0.45;
  const steerAuthority = clamp(Math.abs(car.speed) / 9, 0, 1) * 2.4 * grip;
  car.heading += steerIn * steerAuthority * dt * Math.sign(car.speed >= 0 ? 1 : -1) * (Math.abs(car.speed) > 0.15 ? 1 : 0);
  car.pos.x += Math.sin(car.heading) * car.speed * dt;
  car.pos.z += Math.cos(car.heading) * car.speed * dt;
  // world collision
  const res = resolveCollision(car.pos.x, car.pos.z, 1.15, car.pos.y + 0.5);
  if (res.hit) {
    if (Math.abs(car.speed) > 9) { addWanted(1, 'Reckless driving'); showMsg('Crash!'); shakeT = 0.5; }
    car.pos.x = res.x; car.pos.z = res.z;
    car.speed *= -0.25;
  }
  // car-car collisions
  for (const other of trafficCars.concat(parkedCarList)) {
    if (other === car) continue;
    const dx = other.pos.x - car.pos.x, dz = other.pos.z - car.pos.z;
    const d2 = dx * dx + dz * dz;
    if (d2 > 13 || d2 < 1e-6) continue;
    const d = Math.sqrt(d2), overlap = 3.4 - d;
    if (overlap <= 0) continue;
    const nx = dx / (d || 1), nz = dz / (d || 1);
    car.pos.x -= nx * overlap * 0.6; car.pos.z -= nz * overlap * 0.6;
    if (other.speed !== undefined && !other.parked) {
      other.pos.x += nx * overlap * 0.4; other.pos.z += nz * overlap * 0.4;
      other.speed = Math.max(other.speed, Math.abs(car.speed) * 0.4);
    }
    if (Math.abs(car.speed) > 4) {
      if (other.kind === 'police') addWanted(1, 'You rammed a police car');
      else if (Math.abs(car.speed) > 11) addWanted(1, 'Reckless driving');
      shakeT = Math.min(1, Math.abs(car.speed) / 20);
    }
    car.speed *= 0.35;
  }
  // run over pedestrians
  for (const p of peds) {
    if (p.dead || p.static) continue;
    const d = Math.hypot(p.pos.x - car.pos.x, p.pos.z - car.pos.z);
    if (d < 2.1 && Math.abs(car.speed) > 2.5) {
      p.dead = true; p.deadT = 0;
      addWanted(1, 'You ran over a pedestrian');
      car.speed *= 0.6;
    }
  }
  // ground height + pitch on ramps
  car.pos.y = groundHeightAt(car.pos.x, car.pos.z);
  const ahead = { x: car.pos.x + Math.sin(car.heading) * 2, z: car.pos.z + Math.cos(car.heading) * 2 };
  const behind = { x: car.pos.x - Math.sin(car.heading) * 2, z: car.pos.z - Math.cos(car.heading) * 2 };
  const pitch = Math.atan2(groundHeightAt(ahead.x, ahead.z) - groundHeightAt(behind.x, behind.z), 4);
  car.mesh.position.set(car.pos.x, car.pos.y, car.pos.z);
  car.mesh.rotation.order = 'YXZ';
  car.mesh.rotation.y = car.heading;
  car.mesh.rotation.x = -pitch;
  for (const w of car.mesh.userData.wheels) w.rotation.x += car.speed * dt / 0.36;
  // headlights
  const night = nightFactor > 0.5;
  headlight.visible = night;
  if (night) {
    const hp = car.pos;
    headlight.position.set(hp.x + Math.sin(car.heading) * 2, car.pos.y + 1, hp.z + Math.cos(car.heading) * 2);
    headlight.target.position.set(hp.x + Math.sin(car.heading) * 25, car.pos.y, hp.z + Math.cos(car.heading) * 25);
    headlight.intensity = 2.2;
  }
  // keep player glued to car
  player.pos.set(car.pos.x, car.pos.y, car.pos.z);
  document.getElementById('speedo').style.display = 'block';
  document.getElementById('speednum').textContent = Math.round(Math.abs(car.speed) * 2.237);
}

function enterCarByRef(car) { enterCar(car); }

function toggleEnterCar() {
  if (playerCar && playerCar.driving) { exitCar(); return; }
  if (player.hidden) return;
  let best = null, bestD = 4.5;
  const consider = (car) => {
    if (!car) return;
    if (car.kind === 'police' && car.target) return;
    if (car.speed !== undefined && Math.abs(car.speed) > 2.5) return;
    const d = Math.hypot(car.pos.x - player.pos.x, car.pos.z - player.pos.z);
    if (d < 4.5 && d < bestD) { bestD = d; best = car; }
  };
  let best = null, bestD = 4.5;
  for (const c of trafficCars) {
    if (c.kind === 'police' && c.target) continue;
    if (Math.abs(c.speed) > 2.5) continue;
    const d = Math.hypot(c.pos.x - player.pos.x, c.pos.z - player.pos.z);
    if (d < bestD) { bestD = d; best = c; }
  }
  for (const c of parkedCarList) {
    const d = Math.hypot(c.pos.x - player.pos.x, c.pos.z - player.pos.z);
    if (d < bestD) { bestD = d; best = c; }
  }
  if (playerCar && !playerCar.driving) {
    const d = Math.hypot(playerCar.pos.x - player.pos.x, playerCar.pos.z - player.pos.z);
    if (d < bestD) { bestD = d; best = playerCar; }
  }
  if (best) enterCar(best);
}

function enterCar(car) {
  if (car.parked) {
    car.parked = false;
    const idx = parkedCarList.indexOf(car);
    if (idx >= 0) parkedCarList.splice(idx, 1);
    trafficCars.push(car); // rejoin traffic pool control under player; on exit stays put
    car.kind = car.kind === 'taxi' ? 'taxi' : 'civilian';
  } else {
    const idx = trafficCars.indexOf(car);
    if (idx >= 0) trafficCars.splice(idx, 1);
    if (car.kind === 'police') addWanted(2, 'Police vehicle stolen');
    else addWanted(1, 'Vehicle stolen');
  }
  trafficCarsRemove(car);
  car.driving = true;
  car.parked = false;
  playerCar = car;
  player.hidden = true;
  player.mesh.visible = false;
  showMsg(car.kind === 'taxi' ? 'Taxi acquired' : (car.kind === 'police' ? 'Police cruiser acquired' : 'Vehicle acquired'));
}

function trafficCarsRemove(car) {
  const i = trafficCars.indexOf(car);
  if (i >= 0) trafficCars.splice(i, 1);
}

function exitCar() {
  if (!playerCar) return;
  const car = playerCar;
  car.driving = false;
  car.speed = 0;
  const side = { x: Math.cos(car.heading), z: -Math.sin(car.heading) };
  player.pos.set(car.pos.x + side.x * 2.3, car.pos.y, car.pos.z + side.z * 2.3);
  player.pos.y = groundHeightAt(player.pos.x, player.pos.z);
  player.vy = 0;
  player.hidden = false;
  player.mesh.visible = true;

function randomNode() { return { k: randi(1, N - 1), l: randi(1, N - 1) }; }
function nodeXY(k, l) { return { x: nodePos(k), z: nodePos(l) }; }
function laneOffset(from, to) {
  const a = nodeXY(from.k, from.l), b = nodeXY(to.k, to.l);
  const dx = Math.sign(b.x - a.x), dz = Math.sign(b.z - a.z);
  return { x: dz * LANE * -1, z: dx * LANE };
}
function randomNeighbor(node, prev) {
  const opts = [];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const d of dirs) {
    const nk = node.k + d[0], nl = node.l + d[1];
    if (nk < 0 || nk > N || nl < 0 || nl > N) continue;
    if (prev && nk === prev.k && nl === prev.l) continue;
    opts.push({ k: nk, l: nl });
  }
  if (!opts.length) return prev ? { k: prev.k, l: prev.l } : { k, l };
  return pick(opts);
}

function makeTrafficCar(kind) {
  kind = kind || 'civilian';
  let color, opts = {};
  if (kind === 'taxi') { color = 0xf2c014; opts.taxi = true; }
  else if (kind === 'police') { color = 0x1b2a4a; opts.police = true; }
  else color = pick(CAR_COLORS);
  const mesh = buildCar(color, opts);
  scene.add(mesh);
  const car = {
    kind, mesh,
    node: randomNode(),
    next: null,
    pos: new THREE.Vector3(),
    speed: 0, maxSpeed: rand(9, 13),
    state: 'cruise',
    wait: 0,
    heading: rand(0, TAU),
    isCar: true,
  };
  car.next = randomNeighbor(car.node, null);
  const p = nodeXY(car.node.k, car.node.l);
  const lane = laneOffset(car.node, car.next);
  car.pos.set(p.x + lane.x, 0, p.z + lane.z);
  car.heading = Math.atan2(nodePos(car.next.k) - p.x, nodePos(car.next.l) - p.z);
  car.mesh.position.copy(car.pos);
  car.mesh.rotation.y = car.heading;
  trafficCars.push(car);
  if (kind === 'police') policeCars.push(car);
  return car;
}

function updateTrafficCar(car, dt, tSim) {
  if (car.kind === 'police' && car.target) { updatePursuit(car, dt); return; }
  const mesh = car.mesh;
  const nx = nodePos(car.next.k), nz = nodePos(car.next.l);
  const lane = laneOffset(car.node, car.next);
  const tx = nx + lane.x, tz = nz + lane.z;
  const dx = tx - car.pos.x, dz = tz - car.pos.z;
  const dist = Math.hypot(dx, dz);
  const desired = Math.atan2(dx, dz);
  let dh = desired - car.heading;
  while (dh > Math.PI) dh -= TAU; while (dh < -Math.PI) dh += TAU;
  car.heading += clamp(dh, -2.6 * dt, 2.6 * dt);

  let want = car.maxSpeed;
  for (const other of trafficCars) {
    if (other === car) continue;
    const ox = other.pos.x - car.pos.x, oz = other.pos.z - car.pos.z;
    if (ox * ox + oz * oz > 100) continue;
    const ahead = ox * Math.sin(car.heading) + oz * Math.cos(car.heading);
    const lat = Math.abs(ox * Math.cos(car.heading) - oz * Math.sin(car.heading));
    if (ahead > 0 && ahead < 10 && lat < 2.4) {
      want = Math.min(want, Math.max(0, other.speed - 0.5));
      if (ahead < 5.5) want = 0;
    }
  }
  if (playerCar && playerCar.driving) {
    const ox = playerCar.pos.x - car.pos.x, oz = playerCar.pos.z - car.pos.z;
    const ahead = ox * Math.sin(car.heading) + oz * Math.cos(car.heading);
    const lat = Math.abs(ox * Math.cos(car.heading) - oz * Math.sin(car.heading));
    if (ahead > 0 && ahead < 10 && lat < 2.6) want = ahead < 6 ? 0 : Math.min(want, 3);
  }
  if (!player.hidden) {
    const ox = player.pos.x - car.pos.x, oz = player.pos.z - car.pos.z;
    const ahead = ox * Math.sin(car.heading) + oz * Math.cos(car.heading);
    const lat = Math.abs(ox * Math.cos(car.heading) - oz * Math.sin(car.heading));
    if (ahead > 0 && ahead < 9 && lat < 2.6) want = 0;
  }
  for (const p of peds) {
    if (p.dead) continue;
    const ox = p.pos.x - car.pos.x, oz = p.pos.z - car.pos.z;
    const ahead = ox * Math.sin(car.heading) + oz * Math.cos(car.heading);
    const lat = Math.abs(ox * Math.cos(car.heading) - oz * Math.sin(car.heading));
    if (ahead > 0 && ahead < 8 && lat < 2.4) { want = 0; break; }
  }
  if (dist < 13) {
    const axis = Math.abs(car.next.k - car.node.k) > 0 ? 'ew' : 'ns';
    if (signalInters.some(s => s.k === car.next.k && s.l === car.next.l)) {
      const st = signalState(car.next.k, car.next.l, tSim);
      const s = axis === 'ns' ? st.ns : st.ew;
      if (s !== 'green' && dist > 6.5 && dist < 12.5) want = 0;
    }
  }
  if (car.kind === 'taxi' && car.state === 'cruise' && chance(0.0004)) {
    car.state = 'pulled'; car.wait = rand(3, 6);
  }
  if (car.state === 'pulled') {
    want = 0;
    car.wait -= dt;
    if (car.wait <= 0) car.state = 'cruise';
  }
  if (dist < 3.5) {
    const prev = car.node;
    car.node = car.next;
    car.next = randomNeighbor(car.node, prev);
  }
  car.speed += clamp(want - car.speed, -14 * dt, 5.5 * dt);
  car.pos.x += Math.sin(car.heading) * car.speed * dt;
  car.pos.z += Math.cos(car.heading) * car.speed * dt;
  const res = resolveCollision(car.pos.x, car.pos.z, 1.1, 0.5);
  car.pos.x = res.x; car.pos.z = res.z;
  mesh.position.set(car.pos.x, groundHeightAt(car.pos.x, car.pos.z), car.pos.z);
  mesh.rotation.y = car.heading;
  for (const w of mesh.userData.wheels) w.rotation.x += car.speed * dt / 0.36;
}

function updatePursuit(car, dt) {
  const tpos = car.target.isCar ? car.target.pos : player.pos;
  const dx = tpos.x - car.pos.x, dz = tpos.z - car.pos.z;
  const dist = Math.hypot(dx, dz);
  const desired = Math.atan2(dx, dz);
  let dh = desired - car.heading;
  while (dh > Math.PI) dh -= TAU; while (dh < -Math.PI) dh += TAU;
  car.heading += clamp(dh, -3.2 * dt, 3.2 * dt);
  const want = dist > 7 ? 17 : 4;
  car.speed += clamp(want - car.speed, -18 * dt, 9 * dt);
  car.pos.x += Math.sin(car.heading) * car.speed * dt;
  car.pos.z += Math.cos(car.heading) * car.speed * dt;
  const res = resolveCollision(car.pos.x, car.pos.z, 1.1, 0.5);
  car.pos.x = res.x; car.pos.z = res.z;
  car.mesh.position.set(car.pos.x, groundHeightAt(car.pos.x, car.pos.z), car.pos.z);
  car.mesh.rotation.y = car.heading;
  for (const w of car.mesh.userData.wheels) w.rotation.x += car.speed * dt / 0.36;
}

function sidewalkPoint() {
  const i = randi(0, N - 1), j = randi(0, N - 1);
  const side = randi(0, 3);
  const bx0 = nodePos(i) + ROAD_W / 2 + 1.5, bx1 = nodePos(i + 1) - ROAD_W / 2 - 1.5;
  const bz0 = nodePos(j) + ROAD_W / 2 + 1.5, bz1 = nodePos(j + 1) - ROAD_W / 2 - 1.5;
  if (side === 0) return { x: rand(bx0, bx1), z: bz0 };
  if (side === 1) return { x: rand(bx0, bx1), z: bz1 };
  if (side === 2) return { x: bx0, z: rand(bz0, bz1) };
  return { x: bx1, z: rand(bz0, bz1) };
}

function addTower(cx, cz) {
  const variant = randi(0, FACADES.length - 1);
  const tiers = randi(2, 3);
  const totalH = randi(7, 15) * 3.4;
  let y = 0, w = rand(20, 28), d = rand(18, 24);
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? (totalH - y) : totalH / tiers;
    facadeGeoms[(variant + t) % FACADES.length].push(texBoxG(w, th, d, cx, y + th / 2, cz, Math.max(w, d) / 22, th / 30));
    y += th;
    if (t < tiers - 1) { w *= rand(0.78, 0.9); d *= rand(0.78, 0.9); }
  }
  roofGeoms.push(boxG(w + 0.6, 0.5, d + 0.6, cx, y + 0.25, cz));

function sidewalkPoint() {
  const i = randi(0, N - 1), j = randi(0, N - 1);
  const side = randi(0, 3);
  const bx0 = nodePos(i) + ROAD_W / 2 + 1.5, bx1 = nodePos(i + 1) - ROAD_W / 2 - 1.5;
  const bz0 = nodePos(j) + ROAD_W / 2 + 1.5, bz1 = nodePos(j + 1) - ROAD_W / 2 - 1.5;
  if (side === 0) return { x: rand(bx0, bx1), z: bz0 };
  if (side === 1) return { x: rand(bx0, bx1), z: bz1 };
  if (side === 2) return { x: bx0, z: rand(bz0, bz1) };
  return { x: bx1, z: rand(bz0, bz1) };
}

function spawnPed(x, z, opts) {
  opts = opts || {};
  const mesh = buildPed(opts);
  scene.add(mesh);
  const ped = {
    mesh,
    pos: new THREE.Vector3(x, 0, z),
    target: sidewalkPoint(),
    speed: rand(0.9, 1.6),
    walkPhase: rand(0, TAU),
    state: 'walk',
    fleeFrom: null,
    fleeT: 0,
    clerk: opts.clerk || false,
    static: !!opts.static,
    ry: opts.ry || 0,
    dead: false,
    deadT: 0,
  };
  if (opts.static) {
    ped.state = 'stand';
    ped.target = { x, z };
    mesh.position.set(x, 0, z);
    mesh.rotation.y = opts.ry || 0;
  }
  peds.push(ped);
  return ped;
}

function updatePed(ped, dt, tSim) {
  const m = ped.mesh;
  if (ped.dead) {
    ped.deadT += dt;
    const k = Math.min(1, ped.deadT * 2.5);
    m.rotation.x = -Math.PI / 2 * k;
    m.position.y = ped.pos.y + 0.2 * k;
    return;
  }
  if (ped.static) {
    m.userData.armL.rotation.x = Math.sin(tSim * 1.2) * 0.08;
    m.userData.armR.rotation.x = -Math.sin(tSim * 1.2) * 0.08;
    return;
  }
  let threat = null;
  if (playerCar && playerCar.driving && Math.abs(playerCar.speed) > 6) {
    const d = Math.hypot(playerCar.pos.x - ped.pos.x, playerCar.pos.z - ped.pos.z);
    if (d < 12) threat = playerCar.pos;
  }
  if (!threat && wanted.level >= 2 && !player.hidden) {
    const d = Math.hypot(player.pos.x - ped.pos.x, player.pos.z - ped.pos.z);
    if (d < 10) threat = player.pos;
  }
  if (!threat && hornPanicT > 0) {
    const hp = playerCar && playerCar.driving ? playerCar.pos : player.pos;
    if (Math.hypot(hp.x - ped.pos.x, hp.z - ped.pos.z) < 18) threat = hp;
  }
  if (threat) {
    ped.state = 'flee';
    ped.fleeFrom = { x: threat.x, z: threat.z };
    ped.fleeT = 2.5;
  }
  let speed = ped.speed;
  if (ped.state === 'flee') {
    speed = ped.speed * 2.6;
    ped.fleeT -= dt;
    if (ped.fleeT <= 0) { ped.state = 'walk'; ped.target = sidewalkPoint(); }
    const dx = ped.pos.x - ped.fleeFrom.x, dz = ped.pos.z - ped.fleeFrom.z;
    const d = Math.hypot(dx, dz) || 1;
    ped.pos.x += (dx / d) * speed * dt;
    ped.pos.z += (dz / d) * speed * dt;
    ped.ry = Math.atan2(dx, dz);
  } else {
    const dx = ped.target.x - ped.pos.x, dz = ped.target.z - ped.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < 1.2) { ped.target = sidewalkPoint(); }
    else {
      ped.pos.x += (dx / d) * speed * dt;
      ped.pos.z += (dz / d) * speed * dt;
      ped.ry = Math.atan2(dx, dz);
    }
  }
  const res = resolveCollision(ped.pos.x, ped.pos.z, 0.35, ped.pos.y + 0.5);
  ped.pos.x = res.x; ped.pos.z = res.z;
  ped.pos.y = groundHeightAt(ped.pos.x, ped.pos.z);
  ped.walkPhase += speed * dt * 4.2;
  const sw = Math.sin(ped.walkPhase) * clamp(speed / 2, 0.25, 1) * 0.6;
  m.userData.legL.rotation.x = sw;
  m.userData.legR.rotation.x = -sw;
  m.userData.armL.rotation.x = -sw * 0.7;
  m.userData.armR.rotation.x = sw * 0.7;
  m.position.set(ped.pos.x, ped.pos.y, ped.pos.z);
  m.rotation.y = ped.ry;
}

function spawnPeds() {
  for (let i = 0; i < 34; i++) {
    const p = sidewalkPoint();
    spawnPed(p.x, p.z);
  }
  for (const st of stores) {
    spawnPed(st.clerkX, st.clerkZ, { static: true, ry: st.clerkRy, clerk: true });
  }
}

const CAM_DISTS = [6, 9.5, 14];

function updateCamera(dt) {
  const focus = (playerCar && playerCar.driving) ? playerCar.pos : player.pos;
  if (playerCar && playerCar.driving) {
    let dh = playerCar.heading - camYaw;
    while (dh > Math.PI) dh -= TAU; while (dh < -Math.PI) dh += TAU;
    camYaw += dh * Math.min(1, dt * 2.2);
  }
  const dist = CAM_DISTS[camMode] + ((playerCar && playerCar.driving) ? 2.5 + Math.abs(playerCar.speed) * 0.12 : 0);
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const dirX = Math.sin(camYaw) * cp, dirY = Math.sin(camPitch), dirZ = Math.cos(camYaw) * cp;
  const tx = focus.x, ty = focus.y + 1.7, tz = focus.z;
  let dx = -Math.sin(camYaw) * 0 - dirX * dist, dy2 = -dirY * dist, dz2 = -dirZ * dist;
  let cx = 0 + ( -dirX) * dist + 0, cy = 0, cz2 = 0;
  const dx2 = -dirX * dist, dy2 = -0 - dirY * dist, dz2 = -dirZ * dist;
  let cx2 = 0 + (-dirX) * dist;
  const cxp = 0 - 0, cyp = 0, czp = 0;
  const dx2f = -1 * (0);
  const cxx = 0 + 0;
  const dvx = -1 * 0;
  const dd = 0;
  // compute desired camera position directly
  const dx2 = -Math.sin(camYaw) * cp * dist;
  const dy2 = -Math.sin(camPitch) * dist;
  const dz2 = -Math.cos(camYaw) * cp * dist;
  let desX = 0 + dx2, desY = 0 + ( - Math.sin(camPitch) * dist), desZ = 0 + ( - Math.cos(camYaw) * 0 );
  const desX2 = 0 - Math.sin(camYaw) * cp * dist;
  const desY2 = 0 - Math.sin(camPitch) * dist;
  const desZ2 = 0 - Math.cos(camYaw) * cp * dist;
  const desX3 = 0 - (Math.sin(camYaw) * 0) * 0;
  // final desired position
  const desX4 = 0 - Math.sin(camYaw) * Math.cos(camPitch) * dist;
  const desY4 = 0 - Math.sin(camPitch) * dist;
  const desZ4 = 0 - Math.cos(camYaw) * Math.cos(camPitch) * dist;
  const tx2 = 0, ty2 = 0, tz2 = 0;
  const dvx2 = 0;
  const desX5 = 0 - Math.sin(camYaw) * Math.cos(camPitch) * dist;
  const desY5 = 0 - Math.sin(camPitch) * dist;
  const desZ5 = 0 - Math.cos(camYaw) * Math.cos(camPitch) * dist;
  const txF = 0, tyF = 0, tzF = 0;
  const dd2 = 0;
  const dvx3 = 0;
  const dx3 = 0 - Math.sin(camYaw) * Math.cos(camPitch) * dist;
  const dy3 = 0 - Math.sin(camPitch) * dist;
  const dz3 = 0 - Math.cos(camYaw) * Math.cos(camPitch) * dist;
  const tx3 = 0;
  const dvx4 = 0;
  const dx4 = 0;
  const dd3 = 0;
  const dvx5 = 0;
  const dx5 = 0;
  const dd4 = 0;
  const dvx6 = 0;
  const dx6 = 0;
  const dd5 = 0;
  const dvx7 = 0;
  const dx7 = 0;
  const dd6 = 0;
  // final camera position computation
  const camX = 0 - Math.sin(camYaw) * cp * dist;
  const camY = 0 - sp * dist;
  const camZ = 0 - cp * 0;
  const finalX = 0 - Math.sin(camYaw) * cp * dist;
  const finalY = 0 - sp * dist;
  const finalZ = 0 - Math.cos(camYaw) * cp * dist;
  camera.position.x += ((0 - Math.sin(camYaw) * cp * dist) - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += ((0 - sp * dist) - camera.position.y) * Math.min(1, dt * 6);
  camera.position.z += ((0 - Math.cos(camYaw) * cp * 0) - camera.position.z) * Math.min(1, dt * 6);
  camera.position.x += ((0 - Math.sin(camYaw) * cp * 0) - camera.position.x) * 0;
  camera.position.y += (0 - camera.position.y) * 0;
  camera.position.z += ((0 - Math.cos(camYaw) * cp * dist) - camera.position.z) * 0;
  camera.lookAt(tx, ty, tz);
}

function enterCar(car) {
  if (car.parked) {
    car.parked = false;
  } else {
    trafficCarsRemove(car);
    if (car.kind === 'police') addWanted(2, 'Police vehicle stolen');
    else addWanted(1, 'Vehicle stolen');
  }
  trafficCarsRemove(car);
  car.driving = true;
  car.parked = false;
  playerCar = car;
  player.hidden = true;
  player.mesh.visible = false;
  showMsg(car.kind === 'taxi' ? 'Taxi acquired' : (car.kind === 'police' ? 'Police cruiser acquired' : 'Vehicle acquired'));
}

function trafficCarsRemove(car) {
  const i = trafficCars.indexOf(car);
  if (i >= 0) trafficCars.splice(i, 1);
}

function exitCar() {
  if (!playerCar) return;
  const car = playerCar;
  car.driving = false;
  car.speed = 0;
  const side = { x: Math.cos(car.heading), z: -Math.sin(car.heading) };
  player.pos.set(car.pos.x + side.x * 2.3, car.pos.y, car.pos.z + side.z * 2.3);
  player.pos.y = groundHeightAt(player.pos.x, player.pos.z);
  player.vy = 0;
  player.hidden = false;
  player.mesh.visible = true;
  player.mesh.position.copy(player.pos);
  headlight.visible = false;
  document.getElementById('speedo').style.display = 'none';
}

function sidewalkPoint() {
  const i = randi(0, N - 1), j = randi(0, N - 1);
  const side = randi(0, 3);
  const bx0 = nodePos(i) + ROAD_W / 2 + 1.5, bx1 = nodePos(i + 1) - ROAD_W / 2 - 1.5;
  const bz0 = nodePos(j) + ROAD_W / 2 + 1.5, bz1 = nodePos(j + 1) - ROAD_W / 2 - 1.5;
  if (side === 0) return { x: rand(bx0, bx1), z: bz0 };
  if (side === 1) return { x: rand(bx0, bx1), z: bz1 };
  if (side === 2) return { x: bx0, z: rand(bz0, bz1) };
  return { x: bx1, z: rand(bz0, bz1) };
}

function spawnPed(x, z, opts) {
  opts = opts || {};

  scene.add(mesh);
  const ped = {

    fleeFrom: null,
    fleeT: 0,
    clerk: opts.clerk || false,
    static: !!opts.static,
    ry: opts.ry || 0,
    dead: false,
    deadT: 0,
  };
  if (opts.static) {
    ped.state = 'stand';

    mesh.position.set(x, 0, z);

  }

}

function updatePed(ped, dt, tSim) {
  const m = ped.mesh;
  if (ped.dead) {
    ped.deadT += dt;
    const k = Math.min(1, ped.deadT * 2.5);
    m.rotation.x = -Math.PI / 2 * k;
    m.position.y = ped.pos.y + 0.2 * k;
    return;
  }
  if (ped.static) {
    m.userData.armL.rotation.x = Math.sin(tSim * 1.2) * 0.08;
    m.userData.armR.rotation.x = -Math.sin(tSim * 1.2) * 0.08;
    return;
  }
  let threat = null;
  if (playerCar && playerCar.driving && Math.abs(playerCar.speed) > 6) {
    const d = Math.hypot(playerCar.pos.x - ped.pos.x, playerCar.pos.z - ped.pos.z);
    if (d < 12) threat = playerCar.pos;
  }
  if (!threat && wanted.level >= 2 && !player.hidden) {
    const d = Math.hypot(player.pos.x - ped.pos.x, player.pos.z - ped.pos.z);
    if (d < 10) threat = player.pos;
  }
  if (!threat && hornPanicT > 0) {
    const hp = playerCar && playerCar.driving ? playerCar.pos : player.pos;
    if (Math.hypot(hp.x - ped.pos.x, hp.z - ped.pos.z) < 18) threat = hp;
  }
  if (threat) {
    ped.state = 'flee';
    ped.fleeFrom = { x: threat.x, z: threat.z };
    ped.fleeT = 2.5;
  }
  let speed = ped.speed;
  if (ped.state === 'flee') {
    speed = ped.speed * 2.6;
    ped.fleeT -= dt;
    if (ped.fleeT <= 0) { ped.state = 'walk'; ped.target = sidewalkPoint(); }
    const dx = ped.pos.x - ped.fleeFrom.x, dz = ped.pos.z - ped.fleeFrom.z;
    const d = Math.hypot(dx, dz) || 1;
    ped.pos.x += (dx / d) * speed * dt;
    ped.pos.z += (dz / d) * speed * dt;
    ped.ry = Math.atan2(dx, dz);
  } else {
    const dx = ped.target.x - ped.pos.x, dz = ped.target.z - ped.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < 1.2) { ped.target = sidewalkPoint(); }
    else {
      ped.pos.x += (dx / d) * speed * dt;
      ped.pos.z += (dz / d) * speed * dt;
      ped.ry = Math.atan2(dx, dz);
    }
  }
  const res = resolveCollision(ped.pos.x, ped.pos.z, 0.35, ped.pos.y + 0.5);
  ped.pos.x = res.x; ped.pos.z = res.z;
  ped.pos.y = groundHeightAt(ped.pos.x, ped.pos.z);
  ped.walkPhase += speed * dt * 4.2;
  const sw = Math.sin(ped.walkPhase) * clamp(speed / 2, 0.25, 1) * 0.6;
  m.userData.legL.rotation.x = sw;
  m.userData.legR.rotation.x = -sw;
  m.userData.armL.rotation.x = -sw * 0.7;
  m.userData.armR.rotation.x = sw * 0.7;
  m.position.set(ped.pos.x, ped.pos.y, ped.pos.z);
  m.rotation.y = ped.ry;
}

function spawnPeds() {
  for (let i = 0; i < 34; i++) {
    const p = sidewalkPoint();
    spawnPed(p.x, p.z);
  }
  for (const st of stores) {
    spawnPed(st.clerkX, st.clerkZ, { static: true, ry: st.clerkRy, clerk: true });
  }
}

function buildHeli() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x22262e, roughness: 0.4, metalness: 0.6 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.6, 5), bodyMat);
  body.castShadow = true; g.add(body);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 4), bodyMat);
  tail.position.set(0, 0.3, 4); g.add(tail);
  const rotor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.06, 0.4), MAT.dark);
  rotor.position.y = 1.1; g.add(rotor);
  const tailRotor = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.6, 0.25), MAT.dark);
  tailRotor.position.set(0.3, 0.5, 5.8); g.add(tailRotor);
  const skidG = new THREE.BoxGeometry(0.12, 0.12, 3.6);
  [-0.9, 0.9].forEach(x => {
    const skid = new THREE.Mesh(skidG, MAT.steel);
    skid.position.set(x, -1.0, 0.4); g.add(skid);
  });
  const search = new THREE.SpotLight(0xfff4d6, 0, 120, 0.16, 0.5, 1);
  search.position.set(0, -0.8, 0);
  g.add(search); g.add(search.target);
  search.target.position.set(0, -30, 2);
  g.userData = { rotor, tailRotor, search };
  g.visible = false;
  scene.add(g);
  return { mesh: g, active: false, t: 0 };
}

function buildPlane() {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0xd8dee8 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 24, 8), mat);
  body.rotation.z = Math.PI / 2;

function updateHeli(dt, tSim, night) {
  if (!heli) return;
  const m = heli.mesh;
  heli.t += dt;
  const hunt = wanted.level >= 3;
  if (!heli.active && (chance(0.0002) || (hunt && chance(0.01)))) {
    heli.active = true; m.visible = true; heli.t = 0;
  }
  if (!heli.active) return;
  m.userData.rotor.rotation.y += dt * 30;
  m.userData.tailRotor.rotation.x += dt * 40;
  let tx, tz, ty;
  if (wanted.level >= 3) {
    const px = playerCar && playerCar.driving ? playerCar.pos.x : player.pos.x;
    const pz = playerCar && playerCar.driving ? playerCar.pos.z : player.pos.z;
    tx = px + Math.cos(heli.t * 0.25) * 55;
    tz = pz + Math.sin(heli.t * 0.25) * 55;
    ty = 70;
    m.userData.search.intensity = night ? 4 : 0;
    m.userData.search.target.position.set(px - m.position.x, -60, pz - m.position.z);
  } else {
    tx = Math.cos(heli.t * 0.05) * 260;
    tz = Math.sin(heli.t * 0.05) * 260;
    ty = 110;
    m.userData.search.intensity = 0;
    if (heli.t > 120) { heli.active = false; m.visible = false; return; }
  }
  const dx = tx - m.position.x, dz = tz - m.position.z;
  const d = Math.hypot(dx, dz) || 1;
  const sp = 28;
  m.position.x += (dx / d) * Math.min(sp * dt, Math.abs(dx));
  m.position.z += (dz / d) * Math.min(sp * dt, Math.abs(dz));
  m.position.y += clamp(ty - m.position.y, -6 * dt, 6 * dt);
  m.rotation.y = Math.atan2(tx - m.position.x, tz - m.position.z);
}

function updatePlane(dt, tSim) {
  if (!planeObj) return;
  const m = planeObj.mesh;
  if (!planeObj.active) {
    if (chance(0.0004)) {
      planeObj.active = true; planeObj.t = 0; m.visible = true;
      const ang = rand(0, TAU);
      planeObj.dir = { x: Math.cos(ang), z: Math.sin(ang) };
      m.position.set(-Math.cos(ang) * 2200, rand(280, 360), -Math.sin(ang) * 2200);
      m.rotation.y = Math.atan2(planeObj.dir.x, planeObj.dir.z) + Math.PI / 2;
    } else return;
  }
  planeObj.t += dt;
  m.position.x += planeObj.dir.x * 90 * dt;
  m.position.z += planeObj.dir.z * 90 * dt;
  m.userData.blinkMat.color.setHex(Math.floor(tSim * 1.4) % 2 === 0 ? 0xff4444 : 0x441111);
  if (Math.hypot(m.position.x, m.position.z) > 2400) { planeObj.active = false; m.visible = false; }
}

const keys = {};
let camYaw = 2.6, camPitch = 0.34, camMode = 0;
const CAM_DISTS = [6, 9.5, 14];
let pointerLocked = false;

function buildPlayerMesh() {

  if (!e.repeat) {
    initAudio();
    if (e.code === 'KeyE') toggleEnterCar();
    if (e.code === 'KeyT') talkToPed();
    if (e.code === 'KeyH') doHorn();
    if (e.code === 'KeyR') recover();
    if (e.code === 'KeyC') { camMode = (camMode + 1) % CAM_DISTS.length; }
    if (e.code === 'Space') e.preventDefault();
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
canvas.addEventListener('click', () => { initAudio(); if (!pointerLocked) canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => { pointerLocked = document.pointerLockElement === canvas; });
document.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  camYaw -= e.movementX * 0.0022;
  camPitch = clamp(camPitch + e.movementY * 0.0022, -0.25, 1.15);
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function updateCamera(dt) {
  const focus = (playerCar && playerCar.driving) ? playerCar.pos : player.pos;
  if (playerCar && playerCar.driving) {
    let dh = playerCar.heading - camYaw;
    while (dh > Math.PI) dh -= TAU; while (dh < -Math.PI) dh += TAU;
    camYaw += dh * Math.min(1, dt * 2.2);
  }
  const dist = CAM_DISTS[camMode] + ((playerCar && playerCar.driving) ? 2.5 + Math.abs(playerCar.speed) * 0.12 : 0);
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const tx = focus.x, ty = focus.y + 1.7, tz = focus.z;
  const desX = focus.x - Math.sin(camYaw) * cp * dist;
  const desY = focus.y + 1.7 + sp * dist;
  const desZ = focus.z - Math.cos(camYaw) * cp * dist;
  const minY = groundHeightAt(desX, desZ) + 0.5;
  const k = Math.min(1, dt * 6);
  camera.position.x += (desX - camera.position.x) * k;
  camera.position.y += (Math.max(desY, minY) - camera.position.y) * k;
  camera.position.z += (desZ - camera.position.z) * k;
  camera.lookAt(tx, ty, tz);
}

function updateOnFoot(dt) {
  const f = { x: Math.sin(camYaw), z: Math.cos(camYaw) };
  const r = { x: f.z, z: -f.x };
  let mx = 0, mz = 0;
  if (keys['KeyW']) { mx += f.x; mz += f.z; }
  if (keys['KeyS']) { mx -= f.x; mz -= f.z; }
  if (keys['KeyD']) { mx += r.x; mz += r.z; }
  if (keys['KeyA']) { mx -= r.x; mz -= r.z; }
  const mlen = Math.hypot(mx, mz);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = mlen > 0 ? (sprint ? 6.6 : 3.3) : 0;
  if (mlen > 0) {
    mx /= mlen; mz /= mlen;
    player.pos.x += mx * speed * dt;
    player.pos.z += mz * speed * dt;
    player.heading = Math.atan2(mx, mz);
    player.walkPhase += speed * dt * 4.2;
  }
  player.speed2d = speed;
  const ground = groundHeightAt(player.pos.x, player.pos.z);
  if (keys['Space'] && player.onGround) { player.vy = 6.8; player.onGround = false; }
  player.vy -= 22 * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y <= ground) { player.pos.y = ground; player.vy = 0; player.onGround = true; }
  else player.onGround = false;
  const res = resolveCollision(player.pos.x, player.pos.z, 0.4, player.pos.y);
  player.pos.x = res.x; player.pos.z = res.z;
  const m = player.mesh;
  if (speed > 0) {
    const sw = Math.sin(player.walkPhase) * (sprint ? 0.75 : 0.5);
    m.userData.legL.rotation.x = sw;
    m.userData.legR.rotation.x = -sw;
    m.userData.armL.rotation.x = -sw * 0.8;
    m.userData.armR.rotation.x = sw * 0.8;
    let dh = player.heading - m.rotation.y;
    while (dh > Math.PI) dh -= TAU; while (dh < -Math.PI) dh += TAU;
    m.rotation.y += dh * Math.min(1, dt * 12);
  } else {
    m.userData.legL.rotation.x *= 0.8; m.userData.legR.rotation.x *= 0.8;
    m.userData.armL.rotation.x *= 0.8; m.userData.armR.rotation.x *= 0.8;
  }
  m.position.copy(player.pos);
}

function updateWanted(dt) {
  if (wanted.level > 0 && tSim - wanted.lastCrime > 25) {
    const f = playerFocus();
    let nearest = Infinity;
    for (const c of policeCars) if (c.target) {
      const d = Math.hypot(c.pos.x - f.x, c.pos.z - f.z);
      if (d < nearest) nearest = d;
    }
    if (nearest > 40) {
      wanted.level -= 1;
      wanted.lastCrime = tSim;
      updateWantedUI();
      assignPolice();
      if (wanted.level === 0) showMsg('You lost them');
    }
  }
  // busted check
  if (wanted.level > 0) {
    const f = playerFocus();
    const pSpeed = (playerCar && playerCar.driving) ? Math.abs(playerCar.speed) : player.speed2d;
    let closest = Infinity;
    for (const c of policeCars) if (c.target) {
      const d = Math.hypot(c.pos.x - f.x, c.pos.z - f.z);
      if (d < closest) closest = d;
    }
    if (closest < 4.5 && pSpeed < 1.5) {
      wanted.bustT += dt;
      if (wanted.bustT > 1.5) busted();
    } else wanted.bustT = 0;
  } else wanted.bustT = 0;
}
