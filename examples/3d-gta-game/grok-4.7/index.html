<script>
'use strict';
const $ = (id) => document.getElementById(id);

const NX = 6, NZ = 6, CELL = 58, RH = 8.2, INSET = 13.2;
const LANE_A = 2.15, LANE_B = 5.05;
const HJ = 3, DECK = 9.2, DECK_HALF = 11.2;
const SHORE = NX * CELL + 16;
const UP = new THREE.Vector3(0, 1, 0);
const AVES = ['Bay Ave','1st Ave','2nd Ave','3rd Ave','4th Ave','5th Ave','Harbor Ave'];
const STS = ['South St','Maple St','Market St','Vesper Fwy','Foundry St','Cedar St','Pier St'];
const PLOT = [
  ['res','res','park','comm','res','port'],
  ['res','shop','dt','dt','gas','ind'],
  ['comm','garage','dt','dt','neon','ind'],
  ['park','dt','dt','dt','const','res'],
  ['hosp','comm','shop','neon','ind','port'],
  ['res','res','park','lot','res','res']
];
const ZNAME = { dt:'Financial District', res:'Maple Heights', park:'Founders Park', comm:'Market Quarter', shop:'Corner Mart', gas:'StarFuel', neon:'Neon Mile', ind:'Ironworks', const:'Meridian Site', garage:'Pike Garage', hosp:'St. Vesper Hospital', port:'The Piers', lot:'Municipal Lot' };

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(0x5E1C);
const rrange = (a,b)=>a+rnd()*(b-a);
const rint = (a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick = (a)=>a[Math.floor(rnd()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const damp = (a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
function dampAngle(a,b,k,dt){let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*(1-Math.exp(-k*dt));}
/* Local forward is -Z. yaw 0 faces world -Z. The only sin/cos heading pair. */
function dirFromYaw(yaw){ return { x: -Math.sin(yaw), z: -Math.cos(yaw) }; }
function yawFromDir(x, z){ return Math.atan2(-x, -z); }
function rightOf(f){ return { x: -f.z, z: f.x }; }

const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9eb4c8, 0.0085);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.12, 1800);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const buckets = {};
function bucket(n){ return buckets[n] || (buckets[n] = { p:[], n:[], u:[], c:[] }); }
function colOf(c){ return c.isColor ? c : new THREE.Color(c); }
function pushQuad(b, p0,p1,p2,p3, nx,ny,nz, col, u0,v0,u1,v1){
  const ax=p1[0]-p0[0], ay=p1[1]-p0[1], az=p1[2]-p0[2];
  const bx=p2[0]-p0[0], by=p2[1]-p0[1], bz=p2[2]-p0[2];
  const cx=ay*bz-az*by, cy=az*bx-ax*bz, cz=ax*by-ay*bx;
  let A=p0,B=p1,C=p2,D=p3, ua=u0,ub=u1,uc=u1,ud=u0, va=v0,vb=v0,vc=v1,vd=v1;
  if (cx*nx+cy*ny+cz*nz < 0) { B=p3; C=p2; D=p1; ub=u0; uc=u1; ud=u1; vb=v1; vc=v1; vd=v0; }
  const data=[[A,ua,va],[B,ub,vb],[C,uc,vc],[A,ua,va],[C,uc,vc],[D,ud,vd]];
  for (const q of data){ b.p.push(q[0][0],q[0][1],q[0][2]); b.n.push(nx,ny,nz); b.u.push(q[1],q[2]); b.c.push(col.r,col.g,col.b); }
}
function addBox(name, cx,cy,cz, w,h,d, color, yaw=0, pitch=0, uvx=1, uvy=1){
  const b = bucket(name), col = colOf(color);
  const hw=w/2, hh=h/2, hd=d/2;
  const cp=Math.cos(pitch), sp=Math.sin(pitch), cyaw=Math.cos(yaw), syaw=Math.sin(yaw);
  const rot = (x,y,z) => { const y1=y*cp-z*sp, z1=y*sp+z*cp; return [x*cyaw+z1*syaw, y1, -x*syaw+z1*cyaw]; };
  const tp = (x,y,z) => { const r=rot(x,y,z); return [r[0]+cx, r[1]+cy, r[2]+cz]; };
  const P = [[-hw,-hh,-hd],[hw,-hh,-hd],[hw,-hh,hd],[-hw,-hh,hd],[-hw,hh,-hd],[hw,hh,-hd],[hw,hh,hd],[-hw,hh,hd]].map(p=>tp(p[0],p[1],p[2]));
  const faces = [[0,3,2,1,0,-1,0],[4,5,6,7,0,1,0],[0,1,5,4,0,0,-1],[3,7,6,2,0,0,1],[0,4,7,3,-1,0,0],[1,2,6,5,1,0,0]];
  for (const f of faces){
    const n = rot(f[4],f[5],f[6]); const nl = Math.hypot(n[0],n[1],n[2])||1;
    pushQuad(b, P[f[0]],P[f[1]],P[f[2]],P[f[3]], n[0]/nl,n[1]/nl,n[2]/nl, col, 0,0,uvx,uvy);
  }
}
const colliders = [];
function solid(cx,cy,cz,w,h,d, tag='solid'){
  colliders.push({ minx:cx-w/2, maxx:cx+w/2, miny:cy-h/2, maxy:cy+h/2, minz:cz-d/2, maxz:cz+d/2, tag });
}
const surfs = [];
function addSurf(minx,maxx,minz,maxz, fn){ surfs.push({ minx:Math.min(minx,maxx), maxx:Math.max(minx,maxx), minz:Math.min(minz,maxz), maxz:Math.max(minz,maxz), x0:minx, x1:maxx, z0:minz, z1:maxz, fn }); }

function makeWinTex(seed, lit, warm){
  const rng = mulberry32(seed);
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#12161c'; g.fillRect(0,0,128,128);
  for (let y=0;y<4;y++) for (let x=0;x<4;x++){
    const on = rng() < lit;
    g.fillStyle = on ? (warm ? `hsl(${26+rng()*28},82%,${56+rng()*24}%)` : `hsl(${195+rng()*45},48%,${60+rng()*22}%)`) : `hsl(215,10%,${8+rng()*12}%)`;
    g.fillRect(x*32+4, y*32+5, 24, 22);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
const signCache = new Map();
function signTex(text, bg, fg){
  const key = text+'|'+bg+'|'+fg;
  if (signCache.has(key)) return signCache.get(key);
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0,0,512,128);
  g.fillStyle = fg; g.font = '700 68px Arial, Helvetica, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  signCache.set(key, t); return t;
}
function softTex(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32,32,2,32,32,30);
  grd.addColorStop(0,'rgba(255,255,255,0.9)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const winOffice = [makeWinTex(11,0.62,false), makeWinTex(29,0.5,false), makeWinTex(47,0.7,true)];
const winHome = [makeWinTex(71,0.38,true), makeWinTex(83,0.3,true)];
const winWare = makeWinTex(99,0.15,false);

function mat(opts){
  return new THREE.MeshStandardMaterial(Object.assign({
    roughness: 0.86, metalness: 0, vertexColors: !!opts.vc, side: opts.side || THREE.DoubleSide
  }, opts));
}
const mats = {
  asphalt: mat({ vc:true, roughness:0.94, metalness:0.02, color:'#ffffff' }),
  walk: mat({ vc:true, roughness:0.92 }),
  grass: mat({ vc:true, roughness:1 }),
  concrete: mat({ vc:true, roughness:0.88 }),
  metal: mat({ vc:true, roughness:0.38, metalness:0.72 }),
  glass: mat({ vc:true, roughness:0.08, metalness:0.85, color:'#9fb6c6' }),
  trim: mat({ vc:true, roughness:0.5, metalness:0.2 }),
  markW: mat({ vc:true, roughness:0.6, emissive:'#222' }),
  markY: mat({ vc:true, roughness:0.55, color:'#e6c34a' }),
  neonR: mat({ color:'#ff2f4a', emissive:'#ff2f4a', emissiveIntensity:1.4, roughness:0.4 }),
  neonC: mat({ color:'#19e1ff', emissive:'#19e1ff', emissiveIntensity:1.4, roughness:0.4 }),
  neonY: mat({ color:'#ffc14a', emissive:'#ffb020', emissiveIntensity:1.3, roughness:0.4 }),
  neonM: mat({ color:'#ff4ad8', emissive:'#ff4ad8', emissiveIntensity:1.4, roughness:0.4 }),
  rubber: mat({ color:'#1a1c20', roughness:0.7 }),
  skin: mat({ color:'#d7a27a', roughness:0.7 }),
  dirt: mat({ vc:true, roughness:1 })
};
winOffice.concat(winHome, [winWare]).forEach((tex, i) => {
  mats['w'+i] = mat({ map: tex, emissiveMap: tex, emissive: '#fff', emissiveIntensity: 0.25, roughness: 0.42, metalness: 0.12, color:'#ffffff' });
});
const paintMats = {};
function paintMat(hex){
  if (!paintMats[hex]) paintMats[hex] = new THREE.MeshStandardMaterial({ color: hex, metalness: 0.62, roughness: 0.32 });
  return paintMats[hex];
}
const glassMat = new THREE.MeshStandardMaterial({ color:'#9ec4d6', metalness:0.9, roughness:0.06, transparent:true, opacity:0.55 });
const cloth = ['#243044','#8c2f2f','#1f6f62','#c7a15a','#3d3a55','#b9b4ae','#e07a3d','#204060'].map(c => new THREE.MeshStandardMaterial({ color:c, roughness:0.8 }));
const pantsM = ['#22262e','#3a342c','#1c2a3a','#4a4038'].map(c => new THREE.MeshStandardMaterial({ color:c, roughness:0.85 }));

function envMap(){
  const faces = [];
  for (let i=0;i<6;i++){
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0,0,0,32);
    grd.addColorStop(0,'#7aa0c4'); grd.addColorStop(0.55,'#e7c49a'); grd.addColorStop(1,'#6d645c');
    g.fillStyle = grd; g.fillRect(0,0,32,32); faces.push(c);
  }
  const cube = new THREE.CubeTexture(faces); cube.colorSpace = THREE.SRGBColorSpace; cube.needsUpdate = true;
  return cube;
}
scene.environment = envMap();

const skyU = { top:{value:new THREE.Color()}, hor:{value:new THREE.Color()}, bot:{value:new THREE.Color()}, sun:{value:new THREE.Vector3()}, sunC:{value:new THREE.Color()}, night:{value:0} };
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: skyU,
  vertexShader: 'varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
  fragmentShader: `
    uniform vec3 top, hor, bot, sun, sunC; uniform float night; varying vec3 vW;
    void main(){
      vec3 d = normalize(vW);
      float h = d.y;
      vec3 col = mix(hor, top, smoothstep(0.0, 0.62, h));
      col = mix(bot, col, smoothstep(-0.25, 0.08, h));
      float s = max(dot(d, normalize(sun)), 0.0);
      col += sunC * (pow(s, 90.0)*1.5 + pow(s, 5.0)*0.38);
      float stars = step(0.9975, fract(sin(dot(d.xy*40.0, vec2(12.9,78.2)))*43758.5));
      col += vec3(stars) * night * smoothstep(0.1, 0.4, h);
      gl_FragColor = vec4(col, 1.0);
    }`
}));
scene.add(sky);
const hemi = new THREE.HemisphereLight(0xc5d7ea, 0x3a332c, 0.45); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.25);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 8; sun.shadow.camera.far = 220;
sun.shadow.camera.left = sun.shadow.camera.bottom = -80;
sun.shadow.camera.right = sun.shadow.camera.top = 80;
sun.shadow.bias = -0.00035; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const lampLights = [];
for (let i=0;i<8;i++){
  const s = new THREE.SpotLight(0xffd2a4, 0, 22, Math.PI/3.1, 0.55, 1.1);
  scene.add(s, s.target); lampLights.push(s);
}
const headL = new THREE.SpotLight(0xfff3d2, 0, 36, 0.55, 0.45, 1);
const headR = new THREE.SpotLight(0xfff3d2, 0, 36, 0.55, 0.45, 1);
scene.add(headL, headL.target, headR, headR.target);

const HASH = 22; let grid = new Map();
function rebuildHash(){
  grid = new Map();
  for (const c of colliders){
    const i0=Math.floor(c.minx/HASH), i1=Math.floor(c.maxx/HASH), k0=Math.floor(c.minz/HASH), k1=Math.floor(c.maxz/HASH);
    for (let i=i0;i<=i1;i++) for (let k=k0;k<=k1;k++){
      const key=i+','+k; let a=grid.get(key); if(!a){a=[]; grid.set(key,a);} a.push(c);
    }
  }
}
function nearCols(x,z,rad){
  const i0=Math.floor((x-rad)/HASH), i1=Math.floor((x+rad)/HASH), k0=Math.floor((z-rad)/HASH), k1=Math.floor((z+rad)/HASH);
  const out=[], seen=new Set();
  for (let i=i0;i<=i1;i++) for (let k=k0;k<=k1;k++){
    const a=grid.get(i+','+k); if(!a) continue;
    for (const c of a) if (!seen.has(c)){ seen.add(c); out.push(c); }
  }
  return out;
}
const landmarks = { spire:{x:0,y:40,z:0}, hospital:{x:40,z:40}, pier:{x:SHORE,z:3*CELL}, stair:null, station:null };
function highwayY(x,z){
  const cz = HJ*CELL;
  if (Math.abs(z-cz) > DECK_HALF) return null;
  const x0 = 18, x1 = NX*CELL-18, ramp = 42;
  if (x < x0 || x > x1) return null;
  if (x < x0+ramp) return DECK * (x-x0)/ramp;
  if (x > x1-ramp) return DECK * (x1-x)/ramp;
  return DECK;
}
function specialY(x,z,feet){
  const out = [];
  const hy = highwayY(x,z);
  if (hy != null) out.push(hy);
  const st = landmarks.stair, room = landmarks.station;
  if (st && x>=st.x0 && x<=st.x1 && z>=st.z0 && z<=st.z1){
    const t = clamp((z-st.z0)/Math.max(0.001, st.z1-st.z0), 0, 1);
    out.push(lerp(0.02, -6.05, t));
  } else if (room && feet < -0.7 && x>=room.x0 && x<=room.x1 && z>=room.z0 && z<=room.z1){
    out.push(-6.15);
  }
  for (const s of surfs){
    if (x<s.minx||x>s.maxx||z<s.minz||z>s.maxz) continue;
    const y = s.fn(x,z,feet); if (y!=null) out.push(y);
  }
  return out;
}
function onWater(x,z){
  if (x < SHORE) return false;
  if (Math.hypot(x-(SHORE+70), z-4*CELL) < 18) return false;
  if (Math.abs(z-4*CELL) < 3.2 && x > SHORE-4 && x < SHORE+70) return false;
  if (Math.abs(z-2.2*CELL) < 7 && x > SHORE-8 && x < SHORE+28) return false;
  return true;
}
function supportY(x,z,feet,snap,reach){
  const cands = specialY(x,z,feet);
  const hole = (landmarks.stair && x>=landmarks.stair.x0 && x<=landmarks.stair.x1 && z>=landmarks.stair.z0 && z<=landmarks.stair.z1)
    || (landmarks.station && feet<-0.7 && x>=landmarks.station.x0 && x<=landmarks.station.x1 && z>=landmarks.station.z0 && z<=landmarks.station.z1);
  if (!hole) cands.push(onWater(x,z) ? -28 : 0);
  for (const c of nearCols(x,z,0.6)){
    if (c.tag==='rail' || c.tag==='ceil') continue;
    if (x<=c.minx+0.08 || x>=c.maxx-0.08 || z<=c.minz+0.08 || z>=c.maxz-0.08) continue;
    cands.push(c.maxy);
  }
  let best = -999;
  for (const y of cands) if (y <= feet+snap && y >= feet-reach && y>best) best = y;
  return best;
}
function pushCircle(ent){
  const r = ent.r;
  for (let iter=0; iter<3; iter++){
    let hit = false;
    for (const c of nearCols(ent.x, ent.z, r+0.2)){
      if (c.tag==='ceil') continue;
      if (c.maxy <= ent.y + 0.46) continue;
      if (c.miny >= ent.y + ent.h) continue;
      if (ent.x > c.minx && ent.x < c.maxx && ent.z > c.minz && ent.z < c.maxz){
        const dl=ent.x-c.minx, dr=c.maxx-ent.x, df=ent.z-c.minz, db=c.maxz-ent.z;
        const m = Math.min(dl,dr,df,db);
        if (m===dl) ent.x = c.minx-r; else if (m===dr) ent.x = c.maxx+r; else if (m===df) ent.z = c.minz-r; else ent.z = c.maxz+r;
        hit = true; continue;
      }
      const cx = clamp(ent.x, c.minx, c.maxx), cz = clamp(ent.z, c.minz, c.maxz);
      let dx = ent.x-cx, dz = ent.z-cz, d2 = dx*dx+dz*dz;
      if (d2 >= r*r) continue;
      const d = Math.sqrt(d2)||0.0001, pen = r-d;
      ent.x += dx/d*pen; ent.z += dz/d*pen; hit = true;
    }
    if (!hit) break;
  }
}
function ceilingAt(x,y,z,h){
  for (const c of nearCols(x,z,0.4)){
    if (x<=c.minx||x>=c.maxx||z<=c.minz||z>=c.maxz) continue;
    if (c.miny >= y+0.4 && c.miny < y+h) return c.miny;
  }
  return null;
}
function proj(pts, ax, az){
  let mn=1e9, mx=-1e9;
  for (const p of pts){ const d=p.x*ax+p.z*az; if(d<mn)mn=d; if(d>mx)mx=d; }
  return [mn,mx];
}
function carCorners(car){
  const f = dirFromYaw(car.yaw), r = rightOf(f);
  const L=car.halfL, W=car.halfW;
  return [0,1,2,3].map(i => {
    const sL = i<2 ? 1 : -1, sW = i%2?1:-1;
    return { x: car.x + f.x*L*sL + r.x*W*sW, z: car.z + f.z*L*sL + r.z*W*sW };
  });
}
function satMTV(car, box){
  const A = carCorners(car);
  const B = [{x:box.minx,z:box.minz},{x:box.maxx,z:box.minz},{x:box.maxx,z:box.maxz},{x:box.minx,z:box.maxz}];
  const f = dirFromYaw(car.yaw), r = rightOf(f);
  const axes = [{x:1,z:0},{x:0,z:1}, f, r];
  let best=1e9, ox=0, oz=0;
  const bcx=(box.minx+box.maxx)/2, bcz=(box.minz+box.maxz)/2;
  for (const ax of axes){
    const [a0,a1]=proj(A,ax.x,ax.z), [b0,b1]=proj(B,ax.x,ax.z);
    const pen=Math.min(a1,b1)-Math.max(a0,b0);
    if (pen<=0) return null;
    if (pen<best){
      best=pen;
      let s=(car.x-bcx)*ax.x+(car.z-bcz)*ax.z; if (Math.abs(s)<1e-5) s=1;
      s=Math.sign(s); ox=ax.x*pen*s; oz=ax.z*pen*s;
    }
  }
  return {x:ox,z:oz,pen:best};
}
function resolveCarSolid(car){
  let hitHard = 0;
  for (const c of nearCols(car.x, car.z, car.halfL+1)){
    if (c.tag==='curb') continue;
    if (c.maxy < car.y+0.35 || c.miny > car.y+1.6) continue;
    const mtv = satMTV(car, c);
    if (!mtv) continue;
    car.x += mtv.x; car.z += mtv.z;
    if (mtv.pen > hitHard) hitHard = mtv.pen;
  }
  return hitHard;
}
function carsOverlap(a,b){
  if (Math.abs(a.y-b.y)>2.2) return null;
  const A = carCorners(a);
  const f = dirFromYaw(b.yaw), r = rightOf(f);
  const axes = [{x:1,z:0},{x:0,z:1}, dirFromYaw(a.yaw), rightOf(dirFromYaw(a.yaw)), f, r];
  const B = carCorners(b);
  let best=1e9, ox=0, oz=0;
  for (const ax of axes){
    const [a0,a1]=proj(A,ax.x,ax.z), [b0,b1]=proj(B,ax.x,ax.z);
    const pen=Math.min(a1,b1)-Math.max(a0,b0);
    if (pen<=0) return null;
    if (pen<best){
      best=pen; let s=(a.x-b.x)*ax.x+(a.z-b.z)*ax.z; if(Math.abs(s)<1e-5)s=1; s=Math.sign(s);
      ox=ax.x*pen*s; oz=ax.z*pen*s;
    }
  }
  return {x:ox,z:oz,pen:best};
}

function plotOf(i,j){
  const x0=i*CELL+INSET, x1=(i+1)*CELL-INSET, z0=j*CELL+INSET, z1=(j+1)*CELL-INSET;
  return {i,j,x0,x1,z0,z1,cx:(x0+x1)/2,cz:(z0+z1)/2,w:x1-x0,d:z1-z0};
}

function switchback(x, z, y0, y1){
  const flights = 4, run = 6.5, rise = (y1-y0)/flights;
  let y=y0, dir=1, zc=z;
  for (let n=0;n<flights;n++){
    const zA=zc, zB=zc+dir*run;
    const len=Math.abs(zB-zA), cx=x, cz=(zA+zB)/2, cy=(y+y+rise)/2;
    const pitch = Math.atan2(rise, len) * (zB>zA?1:-1);
    const yaw = yawFromDir(0, Math.sign(zB-zA)||1);
    addBox('concrete', cx, cy, cz, 1.45, 0.18, len, '#a79e93', yaw, pitch);
    addSurf(x-0.72, x+0.72, zA, zB, () => {
      const t = (arguments.length, 0);
      return null;
    });
    surfs.push({
      minx:x-0.75, maxx:x+0.75, minz:Math.min(zA,zB), maxz:Math.max(zA,zB),
      fn:(px,pz)=> y + rise * clamp((pz-zA)/(zB-zA),0,1)
    });
    addBox('metal', x-0.68, y+rise*0.5+0.45, cz, 0.06, 0.9, len, '#66717a');
    solid(x-0.68, y+rise*0.5+0.55, cz, 0.1, 1.0, len, 'rail');
    y += rise; zc = zB; dir *= -1;
    addBox('concrete', x, y, zc+dir*0.2, 1.45, 0.18, 1.6, '#b3aa9e');
    solid(x, y, zc+dir*0.2, 1.45, 0.2, 1.6, 'step');
  }
  return y;
}

function flush(){
  const receive = new Set(['asphalt','walk','grass','dirt','concrete']);
  for (const [name,b] of Object.entries(buckets)){
    if (!b.p.length || !mats[name]) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(b.n, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(b.u, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(b.c, 3));
    const mesh = new THREE.Mesh(g, mats[name]);
    mesh.castShadow = name!=='markW' && name!=='markY' && name!=='asphalt';
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
  const trunkGeo = new THREE.CylinderGeometry(1,1.15,2,6);
  const leafGeo = new THREE.IcosahedronGeometry(1, 1);
  const tMesh = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({color:'#6b4a32', roughness:0.9}), Math.max(1,trunkM.length));
  const lMesh = new THREE.InstancedMesh(leafGeo, new THREE.MeshStandardMaterial({color:'#ffffff', roughness:1, vertexColors:false}), Math.max(1,leafM.length));
  trunkM.forEach((m,i)=>tMesh.setMatrixAt(i,m));
  leafM.forEach((m,i)=>{ lMesh.setMatrixAt(i,m); lMesh.setColorAt(i, new THREE.Color().setHSL(0.28+rnd()*0.06, 0.45, 0.28+rnd()*0.12)); });
  tMesh.castShadow = lMesh.castShadow = true; tMesh.receiveShadow = lMesh.receiveShadow = true;
  if (trunkM.length) scene.add(tMesh, lMesh);
  const bulbGeo = new THREE.SphereGeometry(0.16, 8, 6);
  signalMesh = new THREE.InstancedMesh(bulbGeo, new THREE.MeshStandardMaterial({emissive:'#fff', color:'#222', roughness:0.4}), Math.max(1, signalRec.length));
  const m4 = new THREE.Matrix4();
  signalRec.forEach((s,i) => { m4.makeTranslation(s.x, s.y+s.yOff, s.z); signalMesh.setMatrixAt(i, m4); signalMesh.setColorAt(i, new THREE.Color('#221114')); });
  signalMesh.instanceColor.needsUpdate = true;
  scene.add(signalMesh);
}

  const dx=tx-car.x, dz=tz-car.z;
  const desired = yawFromDir(dx, dz) + whisker(car);
  car.yaw = dampAngle(car.yaw, desired, 3.2, dt);
  const dist=Math.hypot(dx,dz);
  const target = dist<5 ? 0 : spd;
  const rate = car.speed<target ? car.acc : car.brake;
  car.speed = damp(car.speed, target, rate*0.15, dt);
  const f=dirFromYaw(car.yaw);
  car.x += f.x*car.speed*dt; car.z += f.z*car.speed*dt;
}
function updateRail(car, dt){
  if (car.turn){
    car.turn.t += dt/car.turn.dur;
    const t = clamp(car.turn.t,0,1), s=t*t*(3-2*t);
    car.x = lerp(car.turn.x0, car.turn.x1, s);
    car.z = lerp(car.turn.z0, car.turn.z1, s);
    car.yaw = dampAngle(car.turn.y0, car.turn.y1, 8, dt);
    car.speed = damp(car.speed, 6, 4, dt);
    if (t>=1){ car.dir=car.turn.dir; car.turn=null; car.decided=true; }
    return;
  }
  const node = nextNode(car);
  const tx=node.i*CELL, tz=node.j*CELL;
  const f=DIRS[car.dir];
  const dist=(tx-car.x)*f.x+(tz-car.z)*f.z;
  let limit = car.max;
  const axis = car.dir%2===0?'ew':'ns';
  if (dist>0 && dist<18 && node.i>=0 && node.j>=0 && node.i<=NX && node.j<=NZ){
    const sig = lightPhase(node.i, node.j, axis);
    const stop = sig==='red' || (sig==='yellow' && dist>8);
    if (stop && dist>5.5) limit = Math.min(limit, Math.max(0, (dist-6.2)*1.15));
    if (!stop && dist<2.6 && !car.decided){
      const nd = chooseDir(node.i, node.j, car.dir);
      car.decided = true;
      if (nd!==car.dir){
        const off=laneOff(nd, car.lane);
        const ex=node.i*CELL+DIRS[nd].x*9+off.x, ez=node.j*CELL+DIRS[nd].z*9+off.z;
        car.turn={t:0,dur:0.55,x0:car.x,z0:car.z,x1:ex,z1:ez,y0:car.yaw,y1:yawFromDir(DIRS[nd].x,DIRS[nd].z),dir:nd};
      }
    }
  }
  if (dist>8) car.decided=false;
  for (const o of cars){
    if (o===car || Math.abs(o.y-car.y)>2) continue;
    const ahead=(o.x-car.x)*f.x+(o.z-car.z)*f.z;
    const lat=Math.abs((o.x-car.x)*(-f.z)+(o.z-car.z)*f.x);
    if (ahead>0 && ahead<9+car.halfL && lat<2.3){
      const want = ahead<4.2+car.halfW ? 0 : Math.min(limit, o.speed);
      if (want<limit) limit=want;
    }
  }
  if (car.kind==='bus'){
    const stops=[[1,2],[3,2],[5,4],[2,5]];
    for (const s of stops){
      const d=Math.hypot(car.x-s[0]*CELL, car.z-s[1]*CELL);
      if (d<12 && car.wait<=0 && rnd()<0.01) car.wait=3.5;
    }
    if (car.wait>0){ car.wait-=dt; limit=0; }
  }
  const rate = car.speed<limit ? car.acc : car.brake;
  car.speed = damp(car.speed, limit, rate*0.25, dt);
  car.x += f.x*car.speed*dt; car.z += f.z*car.speed*dt;
  const off=laneOff(car.dir, car.lane);
  if (car.dir%2===0){ const j=Math.round((car.z-off.z)/CELL); car.z=j*CELL+off.z; }
  else { const i=Math.round((car.x-off.x)/CELL); car.x=i*CELL+off.x; }
  car.yaw = yawFromDir(f.x, f.z);
}
function updateHwy(car, dt){
  const f=DIRS[car.dir];
  const limit=car.max;
  car.speed=damp(car.speed, limit, 3, dt);
  car.x += f.x*car.speed*dt;
  const off=laneOff(car.dir, car.lane);
  car.z = HJ*CELL + off.z;
  car.yaw = yawFromDir(f.x, f.z);
  const minX=CELL+4, maxX=(NX-1)*CELL-4;
  if (car.x>maxX || car.x<minX){
    car.dir = car.dir===0?2:0; car.lane = car.lane?0:1;
    car.x = clamp(car.x, minX, maxX);
  }
}
function updateCars(dt){
  for (const car of cars){
    if (car.controller==='player') updateDrive(car, dt);
    else if (car.controller==='parked') {}
    else if (car.controller==='free') {
      const tgt = car.taxiTarget || (wanted>0 && car.kind==='police' ? playerPos() : null);
      if (tgt) driveFree(car, tgt.x, tgt.z, dt, car.kind==='police'? car.max : 12);
      else car.controller='rail';
    } else if (car.controller==='hwy') updateHwy(car, dt);
    else updateRail(car, dt);
    if (car.controller!=='parked'){
      const hard = resolveCarSolid(car);
      if (hard>0.15 && Math.abs(car.speed)>6){
        car.speed *= -0.25;
        if (car===player.car){ hurt(8+hard*10); if (Math.abs(car.speed)>8) addWanted(1,'You wrecked it.'); }
      }
      for (const o of cars){
        if (o===car || o.x>car.x) continue;
        const mtv=carsOverlap(car,o);
        if (!mtv) continue;
        car.x += mtv.x*0.5; car.z += mtv.z*0.5; o.x -= mtv.x*0.5; o.z -= mtv.z*0.5;
        if (mtv.pen>0.2 && (Math.abs(car.speed)>5 || Math.abs(o.speed)>5)){
          car.speed *= 0.5; o.speed *= 0.5;
          if (car===player.car || o===player.car){ hurt(6); addWanted(1,'That was a hit.'); }
        }
      }
      vehicleFloor(car, dt);
    }
    hitPeds(car);
    syncCarMesh(car, dt);
  }
}
function playerPos(){
  if (player.car) return {x:player.car.x, z:player.car.z, y:player.car.y};
  return {x:player.x, z:player.z, y:player.y};
}
function updateDrive(car, dt){
  const throttle = (keys.KeyW||keys.ArrowUp)?1:0;
  const brake = (keys.KeyS||keys.ArrowDown)?1:0;
  const steer = ((keys.KeyD||keys.ArrowRight)?1:0) - ((keys.KeyA||keys.ArrowLeft)?1:0);
  const hand = !!keys.Space;
  if (Math.abs(car.speed)<0.6 && brake && !throttle) car.speed -= car.acc*0.4*dt;
  else {
    car.speed += throttle*car.acc*dt;
    if (brake){
      if (car.speed>0) car.speed = Math.max(0, car.speed-car.brake*dt);
      else car.speed = Math.min(0, car.speed+car.brake*dt);
    }
  }
  car.speed -= car.speed*0.45*dt;
  car.speed = clamp(car.speed, -6.5, car.max);
  const sign = car.speed<0?-1:1;
  if (hand){ car.yaw += steer*2.2*dt*Math.min(1,Math.abs(car.speed)/4); car.speed *= Math.exp(-2.1*dt); }
  else car.yaw += steer * (0.7+Math.min(Math.abs(car.speed),14)/10) * sign * dt * Math.min(1, Math.abs(car.speed)/2.2);
  const f=dirFromYaw(car.yaw);
  car.x += f.x*car.speed*dt; car.z += f.z*car.speed*dt;
  if (edge('KeyH')) horn();
}
function nearestCar(x,z,maxD){
  let best=null, bd=maxD;
  for (const c of cars){
    if (Math.abs(c.y-player.y)>2.5 && !player.car) continue;
    const d=Math.hypot(c.x-x, c.z-z);
    if (d<bd){ bd=d; best=c; }
  }
  return best;
}
function enterCar(car){
  if (car.controller!=='parked' && car.kind!=='taxi' && Math.abs(car.speed)>1) addWanted(1, 'Grand theft auto.');
  player.car = car; car.controller='player'; car.taxiTarget=null;
  pMesh.visible=false;
  say(car.kind==='taxi' ? 'Cab\'s yours. Or press 1-4 and I\'ll drive.' : 'You\'re behind the wheel.');
}
function exitCar(){
  const car=player.car; if(!car) return;
  const f=dirFromYaw(car.yaw), r=rightOf(f);
  let px=car.x+r.x*(car.halfW+0.9), pz=car.z+r.z*(car.halfW+0.9);
  if (blockedPoint(px, car.y+0.5, pz)) { px=car.x-r.x*(car.halfW+0.9); pz=car.z-r.z*(car.halfW+0.9); }
  player.x=px; player.z=pz; player.y=car.y; player.vy=0;
  player.car=null; pMesh.visible=true;
  car.speed=0;
  if (car.kind==='police' && wanted>0) car.controller='free';
  else if (car.controller==='player') car.controller = car._prev || 'rail';
}
function hitPeds(car){
  if (Math.abs(car.speed)<3.2) return;
  for (const ped of peds){
    if (ped.down>0) continue;
    if (Math.abs(car.y-ped.y)>1.6) continue;
    const f=dirFromYaw(car.yaw), r=rightOf(f);
    const dx=ped.x-car.x, dz=ped.z-car.z;
    const lf=dx*f.x+dz*f.z, lr=dx*r.x+dz*r.z;
    if (Math.abs(lf)<car.halfL+0.4 && Math.abs(lr)<car.halfW+0.35){
      ped.down=7; ped.flee=0;
      car.speed *= 0.7;
      if (car===player.car) addWanted(1, 'You hit someone.');
    }
  }
}
function updatePeds(dt){
  const pp = playerPos();
  for (const ped of peds){
    if (ped.down>0){
      ped.down -= dt;
      ped.body.rotation.x = damp(ped.body.rotation.x, -1.25, 8, dt);
      ped.mesh.position.set(ped.x, ped.y+0.35, ped.z);
      if (ped.down<=0) ped.body.rotation.x=0;
      continue;
    }
    let sp = ped.speed;
    if (ped.flee>0){
      ped.flee -= dt;
      const dx=ped.x-pp.x, dz=ped.z-pp.z;
      ped.yaw = yawFromDir(dx, dz);
      sp = 3.1;
      const f=dirFromYaw(ped.yaw);
      ped.x += f.x*sp*dt; ped.z += f.z*sp*dt;
    } else if (ped.path.length){
      if (ped.pause>0){ ped.pause-=dt; sp=0; }
      else {
        const tg=ped.path[ped.pi];
        const dx=tg[0]-ped.x, dz=tg[1]-ped.z, d=Math.hypot(dx,dz)||0.0001;
        if (d<0.45){ ped.pi=(ped.pi+1)%ped.path.length; if (rnd()<0.25) ped.pause=rrange(0.4,2.2); }
        else { ped.yaw=yawFromDir(dx,dz); ped.x += dx/d*sp*dt; ped.z += dz/d*sp*dt; }
      }
      if (wanted>0 && Math.hypot(ped.x-pp.x, ped.z-pp.z)<8) ped.flee=3;
      if (player.car && Math.abs(player.car.speed)>8 && Math.hypot(ped.x-pp.x, ped.z-pp.z)<5) ped.flee=2.2;
    }
    ped.y = supportY(ped.x, ped.z, ped.y+0.2, 0.4, 0.6);
    if (ped.y<-2) ped.y=0;
    ped.phase += dt*(sp>0.2?8:2);
    const sw = Math.sin(ped.phase)*Math.min(0.7, sp*0.45);
    ped.legL.rotation.x=sw; ped.legR.rotation.x=-sw; ped.armL.rotation.x=-sw*0.8; ped.armR.rotation.x=sw*0.8;
    ped.mesh.position.set(ped.x, ped.y, ped.z);
    ped.mesh.rotation.y = ped.yaw;
  }
}
function shove(){
  if (player.car) return;
  let best=null, bd=1.7;
  for (const ped of peds){
    const d=Math.hypot(ped.x-player.x, ped.z-player.z);
    if (d<bd && ped.down<=0){ bd=d; best=ped; }
  }
  if (!best) return;
  best.down=5; best.flee=0; addWanted(1, 'They\'re calling the cops.');
}
function talk(){
  if (player.car){
    if (player.car.kind==='taxi') say('Where to?  1 Financial  2 Piers  3 Ironworks  4 Hospital');
    return;
  }
  let best=null, bd=2.3;
  for (const ped of peds){
    const d=Math.hypot(ped.x-player.x, ped.z-player.z);
    if (d<bd){ bd=d; best=ped; }
  }
  if (best){
    if (wanted>0){ say('I don\'t want any trouble!'); best.flee=4; }
    else if (best.down>0) say('...');
    else say(best.talk);
    return;
  }
  for (const c of clerks){
    if (Math.hypot(c.x-player.x, c.z-player.z)<2.4){
      if (player.cash>=8){ player.cash-=8; player.hp=Math.min(100, player.hp+35); say('Snack\'s $8. You feel better.'); }
      else say('Come back when you have $8.');
      return;
    }
  }
  const taxi = cars.find(c => c.kind==='taxi' && c!==player.car && Math.hypot(c.x-player.x, c.z-player.z)<46);
  if (taxi){
    taxi.controller='free';
    taxi.taxiTarget={x:player.x, z:player.z+2};
    taxi._prev='rail';
    say('Taxi\'s pulling over.');

}
function addWanted(n, msg){
  if (worldT - heatT < 1.2 && n>0) return;
  heatT = worldT;
  wanted = clamp(wanted+n, 0, 5);
  if (msg) say(msg);
  if (wanted>0){
    let chasing = cars.filter(c=>c.kind==='police' && c.controller==='free').length;
    for (const c of cars){
      if (chasing>=Math.min(4, wanted+1)) break;
      if (c.kind==='police' && c.controller==='rail'){ c.controller='free'; c.taxiTarget=null; chasing++; }
    }
  }
}
function updateWanted(dt){
  const pp=playerPos();
  let seen=false;
  for (const c of cars){
    if (c.kind!=='police') continue;
    const d=Math.hypot(c.x-pp.x, c.z-pp.z);
    if (wanted>0 && c.controller!=='player'){
      if (d<90) c.controller='free';
      if (d<34 && hasLOS(c.x,c.y+1.2,c.z, pp.x, pp.y+1, pp.z)) seen=true;
      if (d<7 && (!player.car || Math.abs(player.car.speed)<3)) bustT += dt; else if (d<7) bustT = Math.max(0, bustT-dt);
    }
  }
  if (wanted>0 && !seen) loseT += dt; else loseT = 0;
  if (loseT>7){ wanted=Math.max(0, wanted-1); loseT=0; if(!wanted) say('They lost you.'); }
  if (bustT>2.4) bust();
  if (wanted<=0){
    for (const c of cars) if (c.kind==='police' && c.controller==='free') c.controller='rail';
    bustT=0;
  }
}
function hasLOS(x,y,z, x2,y2,z2){
  const dx=x2-x, dy=y2-y, dz=z2-z, len=Math.hypot(dx,dy,dz)||1;
  const steps=Math.ceil(len/4);
  for (let i=1;i<steps;i++){
    const t=i/steps, px=x+dx*t, py=y+dy*t, pz=z+dz*t;
    for (const c of nearCols(px,pz,1)){
      if (c.maxy<2 || c.tag==='rail') continue;
      if (px>c.minx && px<c.maxx && pz>c.minz && pz<c.maxz && py>c.miny && py<c.maxy) return false;
    }
  }
  return true;
}
function hurt(n){ player.hp=Math.max(0, player.hp-n); if (player.hp<=0) hospital('You blacked out.'); }
function hospital(msg){
  player.hp=100; wanted=0; bustT=0; loseT=0;

let nightF = 0;
function updateSky(dt){
  hours = (hours + dt/16) % 24;
  const ang = ((hours-6)/12)*Math.PI;
  const elev = Math.sin(ang), az = Math.cos(ang);
  nightF = clamp((0.12-elev)/0.28, 0, 1);
  const sunDir = new THREE.Vector3(az, Math.max(elev, 0.04), 0.25).normalize();
  skyU.sun.value.copy(sunDir);
  const dayTop=new THREE.Color('#6ea2d4'), nightTop=new THREE.Color('#070b16');
  const dayHor=new THREE.Color('#f0c39a'), nightHor=new THREE.Color('#1a2744');
  skyU.top.value.copy(dayTop).lerp(nightTop, nightF);
  skyU.hor.value.copy(dayHor).lerp(nightHor, nightF);
  skyU.bot.value.copy(skyU.hor.value);
  skyU.sunC.value.set(nightF>0.8?'#bcd':'#ffd2a2');
  skyU.night.value=nightF;
  const fogC = skyU.hor.value.clone();
  scene.fog.color.copy(fogC);
  scene.fog.density = 0.0075 + (weather==='rain'?0.004:0) + (weather==='storm'?0.008:0) + nightF*0.004;
  hemi.intensity = lerp(0.55, 0.08, nightF);
  hemi.color.copy(skyU.top.value);
  sun.intensity = lerp(1.35, 0.05, nightF) * (weather==='storm'?0.35: weather==='cloudy'?0.7:1);
  sun.color.set(nightF>0.7?'#9bb4ff':'#fff0d2');
  const pp=playerPos();
  sun.position.set(pp.x+sunDir.x*90, pp.y+sunDir.y*90, pp.z+sunDir.z*90);
  sun.target.position.set(pp.x, pp.y, pp.z); sun.target.updateMatrixWorld();
  const wi = 0.15+nightF*1.15;
  for (let i=0;i<6;i++) if (mats['w'+i]) mats['w'+i].emissiveIntensity = wi;
  mats.neonR.emissiveIntensity = 0.6+nightF*1.6;
  mats.neonC.emissiveIntensity = 0.6+nightF*1.6;
  mats.neonY.emissiveIntensity = 0.5+nightF*1.4;
  mats.neonM.emissiveIntensity = 0.6+nightF*1.6;
  wet = damp(wet, (weather==='rain'||weather==='storm')?1:0, 0.4, dt);
  mats.asphalt.roughness = lerp(0.94, 0.28, wet);
  mats.asphalt.metalness = lerp(0.02, 0.55, wet);
  mats.asphalt.color.set(wet>0.2?'#9aa7b4':'#ffffff');
  if (signalMesh){
    signalRec.forEach((s,i)=>{
      const st=lightPhase(s.i,s.j,s.axis);
      const on = (s.lamp==='r'&&st==='red')||(s.lamp==='y'&&st==='yellow')||(s.lamp==='g'&&st==='green');
      const col = s.lamp==='r'?'#ff2a2a':s.lamp==='y'?'#ffd24a':'#37e06a';
      signalMesh.setColorAt(i, new THREE.Color(on?col:'#14080a'));
    });
    signalMesh.instanceColor.needsUpdate=true;
  }
  const nearL = lampPts.map(p => ({p, d:Math.hypot(p.x-pp.x, p.z-pp.z)})).sort((a,b)=>a.d-b.d).slice(0, lampLights.length);
  lampLights.forEach((L,i)=>{
    const p=nearL[i]&&nearL[i].p; if(!p){L.intensity=0;return;}
    L.intensity = nightF * (nearL[i].d<48? 2.4:0) * (weather==='storm'?0.7:1);
    L.position.set(p.x, p.y, p.z); L.target.position.set(p.x, 0.2, p.z+0.01); L.target.updateMatrixWorld();
  });
}

  planes.forEach((p,i)=>{
    p.position.x = ((worldT*18+i*200)% (NX*CELL+200)) - 40;
    p.position.z = 40+i*80;
    p.position.y = 78+i*18+Math.sin(worldT*0.2+i)*4;
    p.rotation.y = yawFromDir(1,0);
  });
  boat.position.set(SHORE+24+Math.sin(worldT*0.15)*18, -0.7+Math.sin(worldT*1.3)*0.15, 3.1*CELL);
  boat.rotation.y = yawFromDir(Math.cos(worldT*0.15), 0.2);
  birds.forEach((b,i)=>{
    b.a += dt*(0.6+i*0.05);
    b.g.position.set(landmarks.spire.x+Math.cos(b.a)*18, 24+Math.sin(b.a*2)*3, landmarks.spire.z+Math.sin(b.a)*18);
    b.wing.rotation.z = Math.sin(worldT*10+i)*0.6;
    b.g.rotation.y = b.a;
  });
  smokeStacks.forEach((st,si)=>{
    smokeSprites.forEach((p,i)=>{
      if ((i+si)%smokeStacks.length!==si) return;
      p.life += dt*0.15;
      if (p.life>1) p.life=0;
      p.s.position.set(st.x+(i%3)*0.4, st.y+p.life*8, st.z);
      p.s.material.opacity = (1-p.life)*0.35;
    });
  });
  cranes.forEach(c => {
    if (!c.mesh){
      c.mesh=new THREE.Group();
      const mast=new THREE.Mesh(new THREE.BoxGeometry(0.4,8,0.4), paintMat('#e0a03a')); mast.position.y=4;
      const boom=new THREE.Mesh(new THREE.BoxGeometry(14,0.25,0.25), paintMat('#e0a03a')); boom.position.set(6,8,0);
      c.mesh.add(mast, boom); scene.add(c.mesh); c.mesh.position.set(c.x,0,c.z);
    }
    c.mesh.rotation.y = worldT*0.15;
  });
  if (landmarks.station){
    train.x += dt*10; if (train.x>NX*CELL) train.x=-40;
    train.mesh.position.set(landmarks.station.x0+10+Math.sin(worldT*0.2)*0+ (train.x%40), -4.7, landmarks.station.z0+8);
    train.mesh.rotation.y = yawFromDir(1,0);
  }
  if (player.car){
    const f=dirFromYaw(player.car.yaw), r=rightOf(f);
    const y=player.car.y+0.7;
    headL.intensity = headR.intensity = (nightF>0.35||weather==='rain')? 2.2 : 0.15;
    headL.position.set(player.car.x+r.x*0.6+f.x*1.2, y, player.car.z+r.z*0.6+f.z*1.2);
    headR.position.set(player.car.x-r.x*0.6+f.x*1.2, y, player.car.z-r.z*0.6+f.z*1.2);
    headL.target.position.set(player.car.x+f.x*16, y-1, player.car.z+f.z*16);
    headR.target.position.copy(headL.target.position);
    headL.target.updateMatrixWorld(); headR.target.updateMatrixWorld();
  } else { headL.intensity=headR.intensity=0; }
  if (engGain && audioCtx){
    const sp = player.car ? Math.abs(player.car.speed) : 0;
    engGain.gain.value = player.car ? 0.03+sp*0.004 : 0;
    engine.frequency.value = 48+sp*7;
  }
}
function zoneAt(x,z,y){
  if (y>4.5 && Math.abs(z-HJ*CELL)<DECK_HALF+2 && x>10 && x<NX*CELL) return {zone:'Vesper Freeway', street:'elevated lanes'};
  if (y<-1) return {zone:'Central Station', street:'underground'};
  if (x>SHORE-2) return {zone:'East Bay', street:'the waterfront'};
  const i=clamp(Math.floor(x/CELL),0,NX-1), j=clamp(Math.floor(z/CELL),0,NZ-1);
  const ii=clamp(Math.round(x/CELL),0,NX), jj=clamp(Math.round(z/CELL),0,NZ);
  return { zone: ZNAME[PLOT[j][i]]||'Vesper', street: STS[jj]+' & '+AVES[ii] };
}
function drawMap(canvas, range){
  const ctx=canvas.getContext('2d'), w=canvas.width, h=canvas.height;
  const pp=playerPos();
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#141820'; ctx.fillRect(0,0,w,h);
  const sc=w/range;
  const tx=x=>w/2+(x-pp.x)*sc, tz=z=>h/2+(z-pp.z)*sc;
  ctx.strokeStyle='#3c4450'; ctx.lineWidth=Math.max(2, RH*sc*0.7);
  ctx.beginPath();
  for (let i=0;i<=NX;i++){ ctx.moveTo(tx(i*CELL), tz(0)); ctx.lineTo(tx(i*CELL), tz(NZ*CELL)); }
  for (let j=0;j<=NZ;j++){ ctx.moveTo(tx(0), tz(j*CELL)); ctx.lineTo(tx(NX*CELL), tz(j*CELL)); }
  ctx.stroke();
  ctx.fillStyle='#1a6a86'; ctx.fillRect(tx(SHORE), tz(-20), sc*80, sc*(NZ*CELL+40));
  ctx.fillStyle='#e7b15a';
  for (const c of cars){
    if (c.kind==='police') ctx.fillStyle=wanted?'#ff4d3a':'#7eb6ff';
    else if (c.kind==='taxi') ctx.fillStyle='#f0c423';
    else ctx.fillStyle='#d7d2c8';
    ctx.fillRect(tx(c.x)-2, tz(c.z)-2, 4, 4);
  }
  const f=player.car?dirFromYaw(player.car.yaw):dirFromYaw(player.yaw);
  ctx.save(); ctx.translate(w/2,h/2); ctx.rotate(Math.atan2(f.x, -f.z));
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,6); ctx.lineTo(-5,6); ctx.fill(); ctx.restore();
}
function updateHUD(){
  const pp=playerPos();
  const z=zoneAt(pp.x, pp.z, pp.y);
  $('zone').textContent=z.zone; $('street').textContent=z.street;
  const hh=Math.floor(hours)%24, mm=Math.floor((hours%1)*60);
  $('clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  $('wx').textContent=weather+(wet>0.4?' · slick':'');
  let stars='';
  for (let i=0;i<5;i++) stars += i<wanted?'<b>★</b>':'☆';
  $('stars').innerHTML=stars;
  $('hp').style.width=player.hp+'%';
  $('cash').textContent='$'+player.cash;
  $('heat').style.boxShadow = 'inset 0 0 '+(80+wanted*30)+'px rgba(160,0,0,'+(wanted*0.14)+')';
  const driving=!!player.car;
  $('speedo').style.display=driving?'block':'none';
  if (driving) $('speedo').innerHTML=Math.round(Math.abs(player.car.speed)*3.6)+'<small>KM/H</small>';
  let prompt='';
  if (!player.car){
    const c=nearestCar(player.x, player.z, 3.4);
    if (c) prompt='E  enter '+(c.kind==='taxi'?'taxi':c.kind==='police'?'cruiser':'vehicle');
    else if (peds.some(p=>Math.hypot(p.x-player.x,p.z-player.z)<2.2)) prompt='F  talk';
    else if (clerks.some(p=>Math.hypot(p.x-player.x,p.z-player.z)<2.4)) prompt='F  buy a snack · $8';
    else prompt='F  hail a taxi';
  } else prompt = 'E  exit'+(player.car.kind==='taxi'?' · 1-4 destination':'')+' · H horn · R radio';
  const pe=$('prompt'); pe.style.display=prompt?'block':'none'; pe.textContent=prompt;
  if (subT>0){ subT-=1/60; if(subT<=0) $('sub').textContent=''; }
  drawMap($('minimap'), 150);
  $('mapOverlay').style.display=bigMap?'flex':'none';
  if (bigMap){
    const c=$('bigmap'), ctx=c.getContext('2d');
    ctx.fillStyle='#10141c'; ctx.fillRect(0,0,c.width,c.height);
    const sc=c.width/(NX*CELL+40);
    const X=x=>20+(x)*sc, Z=z=>20+(z)*sc;
    for (let j=0;j<NZ;j++) for(let i=0;i<NX;i++){
      ctx.fillStyle = PLOT[j][i]==='park'?'#2f6d38': PLOT[j][i]==='dt'?'#8aa4c4': PLOT[j][i]==='water'?'#1a6a86':'#2a3038';
      const pb=plotOf(i,j); ctx.fillRect(X(pb.x0), Z(pb.z0), pb.w*sc, pb.d*sc);
    }
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(X(pp.x), Z(pp.y?pp.z:pp.z), 5, 0, 7); ctx.fill();
  }
}
function updatePlayer(dt){
  if (player.car){ updateTaxiDrop(); return; }
  camera.updateMatrixWorld();
  camera.getWorldDirection(_fwd); _fwd.y=0; if (_fwd.lengthSq()<1e-6) _fwd.set(0,0,-1); _fwd.normalize();
  _right.crossVectors(_fwd, UP);
  let fIn=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  let sIn=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  const moving = Math.hypot(fIn, sIn)>0.1;
  if (moving){ const l=Math.hypot(fIn,sIn); fIn/=l; sIn/=l; }
  const sprint = keys.ShiftLeft||keys.ShiftRight;
  const sp = sprint?7.4:4.2;
  const mx = (_fwd.x*fIn + _right.x*sIn)*sp;
  const mz = (_fwd.z*fIn + _right.z*sIn)*sp;
  player.x += mx*dt; pushCircle(player);
  player.z += mz*dt; pushCircle(player);
  if (moving) player.yaw = dampAngle(player.yaw, yawFromDir(mx,mz), 12, dt);
  if (edge('Space') && player.grounded){ player.vy=8.05; player.grounded=false; }
  player.vy -= 24*dt;
  const prevY=player.y;
  player.y += player.vy*dt;
  if (player.vy>0){
    const ceil=ceilingAt(player.x, player.y, player.z, player.h);
    if (ceil!=null){ player.y=Math.min(player.y, ceil-player.h-0.02); player.vy=0; }
  }
  const reach=Math.max(0.65, prevY-player.y+0.25);
  const g=supportY(player.x, player.z, prevY, player.vy>0?0.05:0.2, reach);
  if (g>-100 && player.vy<=0 && player.y<=g && prevY+0.15>=g){
    if (prevY-g>3 && player.vy<-12) hurt(((-player.vy)-12)*4);
    player.y=g; player.vy=0; player.grounded=true;
  } else player.grounded=false;
  if (player.grounded){
    const up=supportY(player.x, player.z, player.y, 0.5, 0.15);
    if (up>-100 && up>player.y) player.y=up;
  }
  if (player.y<-4){ hurt(25); player.x=landmarks.pier.x; player.z=landmarks.pier.z; player.y=1; player.vy=0; say('The bay is cold.'); if(player.hp<=0) hospital(); }
  player.speed=Math.hypot(mx,mz);
  const sw=Math.sin(worldT* (sprint?13:9))*Math.min(0.7, player.speed*0.12);
  player.legL.rotation.x=player.grounded?sw:0.4; player.legR.rotation.x=player.grounded?-sw:-0.2;
  player.armL.rotation.x=player.grounded?-sw*0.8:0.5; player.armR.rotation.x=player.grounded?sw*0.8:-0.3;
  pMesh.position.set(player.x, player.y, player.z);
  pMesh.rotation.y=player.yaw;
}
function camOcclude(tx,ty,tz, px,py,pz){
  let dx=px-tx, dy=py-ty, dz=pz-tz; const len=Math.hypot(dx,dy,dz)||1; dx/=len; dy/=len; dz/=len;
  let hit=len;
  const steps=Math.ceil(len/0.8);
  for (let i=1;i<steps;i++){
    const t=i/steps, x=tx+dx*len*t, y=ty+dy*len*t, z=tz+dz*len*t;
    for (const c of nearCols(x,z,0.8)){
      if (x>c.minx && x<c.maxx && z>c.minz && z<c.maxz && y>c.miny && y<c.maxy){ hit=Math.min(hit, t*len); break; }
    }
  }
  const dist=Math.max(0.45, hit-0.35);
  return {x:tx+dx*dist, y:ty+dy*dist, z:tz+dz*dist};
}
function updateCam(dt){
  mouseT += dt;
  const driving=!!player.car;
  const lookYaw = driving ? player.car.yaw : camYaw;
  if (driving && mouseT>0.6) camYaw = dampAngle(camYaw, player.car.yaw, 3.5, dt);
  const pp=playerPos();
  _tgt.set(pp.x, pp.y+(driving?1.2:1.45), pp.z);
  const dist = driving ? 8.5+Math.min(3, Math.abs(player.car.speed)*0.12) : 5.6;
  const flat = dirFromYaw(driving && mouseT>0.6 ? camYaw : camYaw);
  const cp=Math.cos(camPitch), sp=Math.sin(camPitch);
  _look.set(flat.x*cp, sp, flat.z*cp);
  const desired = _tgt.clone().addScaledVector(_look, -dist);
  const pos = camOcclude(_tgt.x,_tgt.y,_tgt.z, desired.x, desired.y, desired.z);
  camera.position.lerp(new THREE.Vector3(pos.x,pos.y,pos.z), 1-Math.exp(-10*dt));
  camera.lookAt(_tgt);
  const camDist = camera.position.distanceTo(_tgt);
  pMesh.visible = !driving && camDist>0.9;
}
let cine=0;
function updateTitleCam(dt){
  cine += dt;
  const s=landmarks.spire;
  const a=cine*0.12;
  camera.position.set(s.x+Math.cos(a)*78, 36+Math.sin(cine*0.3)*6, s.z+Math.sin(a)*78);
  camera.lookAt(s.x, 28, s.z);
}
function startGame(){
  if (started) return;
  started = true; mode='play';
  $('title').style.display='none';
  ensureAudio();
  renderer.domElement.requestPointerLock();
  say('Welcome to Vesper. The city is awake.');
}
function frame(now){
  const dt=Math.min(0.033, (now-(frame.then||now))/1000 || 0.016); frame.then=now;
  worldT += dt;
  if (params.has('noon')) hours = 12.2;
  updateSky(dt); updateWeather(dt);
  updateCars(dt); updatePeds(dt); updateWorldDress(dt);
  if (started){
    updatePlayer(dt); updateWanted(dt); updateCam(dt);
    if (edge('KeyE')){ if (player.car) exitCar(); else { const c=nearestCar(player.x,player.z,3.4); if(c) enterCar(c); } }
    if (edge('KeyF')) talk();
    if (edge('KeyR') && player.car) setRadio(!radioOn);
    if (edge('Digit1')) taxiDest(0);
    if (edge('Digit2')) taxiDest(1);
    if (edge('Digit3')) taxiDest(2);
    if (edge('Digit4')) taxiDest(3);
    if (edge('KeyH') && !player.car) horn();
  } else updateTitleCam(dt);
  updateHUD();
  for (const k in keys) prevK[k]=keys[k];
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
if (params.has('autostart') || params.has('selftest')) {
  started=true; mode='play'; $('title').style.display='none';
}
requestAnimationFrame(frame);

window.__game = { player, cars, peds, colliders };
window.__selfTestControls = async function(){
  started=true; mode='play'; $('title').style.display='none';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  camYaw = 0; camPitch = -0.2;
  player.x = 2*CELL+9.6; player.z = 1*CELL+9.6; player.y=0; player.car=null;
  keys.KeyW=true;
  const z0=player.z;
  await sleep(700);
  keys.KeyW=false;
  const moved = z0-player.z;
  const nose = new THREE.Vector3(); player.nose.getWorldPosition(nose);
  const body = new THREE.Vector3(); pMesh.getWorldPosition(body);
  const front = nose.clone().sub(body); front.y=0; front.normalize();
  const travel = dirFromYaw(player.yaw);
  console.log('SELFTEST move', moved.toFixed(2), 'face', front.dot(new THREE.Vector3(travel.x,0,travel.z)).toFixed(2));
  return { moved, facing: front.dot(new THREE.Vector3(travel.x,0,travel.z)) };
};
